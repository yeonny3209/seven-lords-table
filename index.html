<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>일곱 군주의 탁자</title>
<meta name="description" content="AI 군주 7명과 겨루는 브라우저 오토배틀러. 배치는 전략, 주문은 전술.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👑</text></svg>">
<style>
:root {
  --bg: #120f0d; --bg2: #1c1714; --panel: #231d19; --panel2: #2c2420; --line: #3e332b;
  --text: #f1e7d8; --dim: #a8987f; --gold: #f2c14e; --gold2: #b8862b; --red: #ff5f5f;
  --green: #59d97a; --blue: #5aa9ff; --violet: #b07cff;
  --radius: 10px;
  font-family: 'Pretendard', 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
body {
  background: radial-gradient(ellipse at 50% 20%, #2a201a 0%, var(--bg) 70%);
  overflow-x: hidden; user-select: none; -webkit-user-select: none;
}
button {
  font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line);
  border-radius: 8px; padding: 6px 10px; cursor: pointer; transition: background .15s, border-color .15s, transform .05s;
}
button:hover:not(:disabled) { border-color: var(--gold2); background: #382d26; }
button:active:not(:disabled) { transform: translateY(1px); }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: linear-gradient(#e0a93a, #b47a1f); color: #1d140a; font-weight: 700; border-color: #f5d07a; }
button.primary:hover:not(:disabled) { background: linear-gradient(#f0bb4a, #c48a2a); }
button.ghost { background: transparent; }
button.small { padding: 4px 8px; font-size: 13px; }
small { color: var(--dim); font-weight: 400; }
h3 { margin: 0 0 6px; font-size: 14px; color: var(--gold); letter-spacing: .02em; }
h3.mt { margin-top: 14px; }
.hidden { display: none !important; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 99px; background: var(--panel2); border: 1px solid var(--line); font-size: 12px; color: var(--dim); }

/* 상단 */
#topbar {
  display: flex; align-items: center; gap: 16px; padding: 8px 14px; border-bottom: 1px solid var(--line);
  background: linear-gradient(#251d17, #1a1512); flex-wrap: wrap;
}
.brand { font-weight: 800; font-size: 18px; color: var(--gold); white-space: nowrap; }
.round-info { display: flex; gap: 8px; align-items: center; font-weight: 700; font-size: 18px; }
.stats { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.stat { display: flex; align-items: center; gap: 5px; font-size: 16px; }
.stat b { font-size: 18px; }
.stat.lvl span { font-weight: 800; color: var(--gold); }
.xpbar { width: 70px; height: 7px; background: #0006; border-radius: 4px; overflow: hidden; border: 1px solid var(--line); }
.xpbar i { display: block; height: 100%; background: linear-gradient(90deg, #4aa3ff, #8fd0ff); width: 0; transition: width .3s; }
.top-actions { margin-left: auto; display: flex; gap: 6px; }

/* 레이아웃 */
#layout { display: grid; grid-template-columns: 210px minmax(0, 1fr) 230px; gap: 12px; padding: 12px; max-width: 1280px; margin: 0 auto; }
#left, #right { background: var(--bg2); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; align-self: start; }
#center { display: flex; flex-direction: column; gap: 10px; min-width: 0; align-items: center; }

/* 시너지 */
.trait { display: flex; align-items: center; gap: 7px; padding: 5px 6px; border-radius: 8px; margin-bottom: 4px; background: #0002; border: 1px solid transparent; cursor: help; }
.trait.on { background: #ffffff0d; border-color: var(--line); }
.trait .ti { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 6px; font-size: 15px; background: #0004; }
.trait.on .ti { box-shadow: 0 0 0 2px var(--tc) inset; }
.trait.t3 .ti { background: var(--tc); }
.trait .tn { flex: 1; font-size: 13px; }
.trait .tc { font-size: 12px; color: var(--dim); }
.trait.on .tc b { color: var(--gold); }
.trait.off { opacity: .55; }
.empty-note { color: var(--dim); font-size: 12px; }

#inventory { display: flex; flex-wrap: wrap; gap: 5px; min-height: 30px; }
.item-chip { width: 34px; height: 34px; display: grid; place-items: center; font-size: 19px; background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; cursor: grab; }
.item-chip.done { border-color: var(--gold2); background: #3a2d18; }
.item-chip:hover { border-color: var(--gold); }
#augList { display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
.aug-chip { padding: 4px 6px; background: #0003; border: 1px solid var(--line); border-radius: 6px; cursor: help; }

/* 보드 */
#boardWrap { position: relative; width: 100%; max-width: 500px; }
#board { display: block; width: 100%; height: auto; border-radius: 12px; touch-action: none; }
#banner {
  position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); pointer-events: none;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.spell-banner {
  padding: 6px 14px; border-radius: 99px; background: #000b; border: 1px solid var(--gold2); font-weight: 700;
  font-size: 15px; white-space: nowrap; animation: bannerIn 1.6s ease-out forwards;
}
.spell-banner.enemy { border-color: #ff6b6b; color: #ffd0d0; }
@keyframes bannerIn { 0% { opacity: 0; transform: scale(.7); } 12% { opacity: 1; transform: scale(1.05); } 20% { transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-14px); } }
#aimHint { position: absolute; left: 0; right: 0; top: 6px; text-align: center; pointer-events: none; font-size: 13px; color: var(--gold); text-shadow: 0 1px 3px #000; }

/* 주문 바 */
#spellBar { display: flex; align-items: center; gap: 10px; width: 100%; max-width: 760px; background: var(--bg2); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; flex-wrap: wrap; }
.lordmana { min-width: 150px; }
.lm-label { font-size: 12px; color: var(--dim); margin-bottom: 3px; }
.lm-label b { color: #9fd6ff; font-size: 15px; }
.lm-bar { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; height: 12px; }
.lm-bar i { background: #0005; border-radius: 2px; position: relative; overflow: hidden; border: 1px solid #ffffff10; }
.lm-bar i b { position: absolute; inset: 0; background: linear-gradient(#8fd0ff, #3b7dff); transform-origin: left; }
#spellCards { display: flex; gap: 8px; flex: 1; flex-wrap: wrap; }
.spell-card {
  position: relative; width: 112px; padding: 5px 7px; border-radius: 8px; background: var(--panel2); border: 1px solid var(--line);
  cursor: pointer; font-size: 12px; line-height: 1.25; overflow: hidden;
}
.spell-card .sc-top { display: flex; align-items: center; gap: 4px; font-weight: 700; font-size: 13px; }
.spell-card .sc-icon { font-size: 18px; }
.spell-card .sc-cost { margin-left: auto; color: #9fd6ff; font-weight: 800; }
.spell-card .sc-sub { color: var(--dim); font-size: 11px; display: flex; justify-content: space-between; }
.spell-card .sc-key { position: absolute; left: 3px; bottom: 2px; font-size: 10px; color: #fff6; }
.spell-card.ready { border-color: #7cc6ff; box-shadow: 0 0 12px #3b8cff66; background: #23324a; }
.spell-card.aiming { border-color: var(--gold); box-shadow: 0 0 14px #f2c14e88; }
.spell-card.used { opacity: .35; }
.spell-card .sc-cd { position: absolute; inset: 0; background: #000a; display: grid; place-items: center; font-weight: 800; font-size: 16px; }
.spell-card .sc-auto { font-size: 10px; color: var(--green); }
#btnReady { padding: 10px 16px; font-size: 15px; }

/* 상점 */
#shopBar { display: flex; gap: 8px; width: 100%; max-width: 760px; background: var(--bg2); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px; position: relative; }
.shop-actions { display: flex; flex-direction: column; gap: 6px; }
.shop-actions button { width: 92px; font-size: 13px; line-height: 1.2; }
#shop { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; flex: 1; }
.shop-card {
  position: relative; border-radius: 8px; padding: 6px 4px 5px; background: var(--panel); border: 2px solid var(--cc); cursor: pointer;
  text-align: center; min-height: 92px; display: flex; flex-direction: column; align-items: center; gap: 2px; transition: transform .1s;
}
.shop-card:hover { transform: translateY(-2px); }
.shop-card .se { font-size: 30px; line-height: 1.1; }
.shop-card .sn { font-size: 12px; font-weight: 700; }
.shop-card .st { font-size: 11px; color: var(--dim); }
.shop-card .sp { position: absolute; top: 3px; right: 5px; font-weight: 800; color: var(--gold); font-size: 13px; }
.shop-card.owned { box-shadow: 0 0 0 2px #fff3, 0 0 14px var(--cc); }
.shop-card.owned::after { content: attr(data-own); position: absolute; top: 3px; left: 5px; font-size: 11px; color: #fff; background: #0008; border-radius: 4px; padding: 0 4px; }
.shop-card.merge { animation: pulse 1s infinite alternate; }
@keyframes pulse { from { box-shadow: 0 0 0 2px #ffd56a, 0 0 6px #ffd56a; } to { box-shadow: 0 0 0 2px #ffd56a, 0 0 18px #ffd56a; } }
.shop-card.sold { visibility: hidden; }
.shop-card.poor { filter: grayscale(.7) brightness(.7); }
#sellZone { width: 82px; display: grid; place-items: center; text-align: center; font-size: 11px; color: var(--dim); border: 2px dashed var(--line); border-radius: 8px; }
#sellZone.active { border-color: var(--red); color: var(--red); background: #ff5f5f14; }

/* 순위표 */
.prow { display: flex; align-items: center; gap: 6px; padding: 5px; border-radius: 8px; margin-bottom: 4px; cursor: pointer; border: 1px solid transparent; background: #0002; }
.prow:hover { border-color: var(--line); background: #ffffff08; }
.prow.me { border-color: var(--gold2); }
.prow.dead { opacity: .35; }
.prow.opp { box-shadow: 0 0 0 2px #ff6b6b inset; }
.prow .pe { font-size: 22px; width: 28px; text-align: center; }
.prow .pm { flex: 1; min-width: 0; }
.prow .pn { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prow .ph { height: 6px; background: #0006; border-radius: 3px; overflow: hidden; margin-top: 3px; }
.prow .ph i { display: block; height: 100%; background: linear-gradient(90deg, #ff6b6b, #59d97a); }
.prow .pv { font-weight: 800; font-size: 14px; width: 30px; text-align: right; }
.prow .ps { font-size: 10px; color: var(--dim); }
#matchInfo { margin-top: 10px; font-size: 12px; color: var(--dim); line-height: 1.5; }

/* 툴팁 */
#tooltip {
  position: fixed; z-index: 50; max-width: 290px; background: #0f0c0aee; border: 1px solid var(--gold2); border-radius: 8px; padding: 8px 10px;
  font-size: 12px; line-height: 1.45; pointer-events: none; box-shadow: 0 6px 24px #0009;
}
#tooltip h4 { margin: 0 0 3px; font-size: 14px; color: var(--gold); }
#tooltip .tt-sub { color: var(--dim); }
#tooltip .tt-row { display: flex; flex-wrap: wrap; gap: 2px 10px; margin: 4px 0; }
#tooltip hr { border: 0; border-top: 1px solid var(--line); margin: 5px 0; }
#drag { position: fixed; z-index: 60; pointer-events: none; font-size: 30px; transform: translate(-50%, -50%); filter: drop-shadow(0 4px 6px #000a); }

/* 모달 */
#modal { position: fixed; inset: 0; z-index: 40; background: #000b; display: grid; place-items: center; padding: 16px; }
.modal-box { background: var(--bg2); border: 1px solid var(--gold2); border-radius: 14px; padding: 18px 20px; width: min(760px, 100%); max-height: 92vh; overflow: auto; box-shadow: 0 10px 50px #000; }
.modal-box h2 { margin: 0 0 4px; color: var(--gold); font-size: 22px; }
.modal-box .sub { color: var(--dim); margin: 0 0 14px; font-size: 14px; }
.choice-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.choice {
  border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--panel); cursor: pointer; text-align: left;
  display: flex; flex-direction: column; gap: 4px; transition: border-color .15s, transform .1s;
}
.choice:hover:not(.disabled) { border-color: var(--gold); transform: translateY(-2px); }
.choice.sel { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold) inset; }
.choice.disabled { opacity: .4; cursor: default; }
.choice .ci { font-size: 34px; }
.choice .cn { font-weight: 800; font-size: 15px; }
.choice .cd { font-size: 12px; color: var(--dim); line-height: 1.4; }
.choice.spellc { background: #1d2738; }
.row-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; flex-wrap: wrap; }
.field { display: flex; gap: 8px; align-items: center; margin: 10px 0; flex-wrap: wrap; }
.field label { min-width: 70px; color: var(--dim); font-size: 13px; }
.field input, .field select { font: inherit; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; background: transparent; }
.seg button.on { background: var(--gold2); color: #1b130a; font-weight: 700; }
.title-hero { text-align: center; margin-bottom: 10px; }
.title-hero .crown { font-size: 54px; }
.title-hero h1 { margin: 2px 0; color: var(--gold); font-size: 30px; letter-spacing: .04em; }
.title-hero p { color: var(--dim); margin: 0; }
table.stats { width: 100%; border-collapse: collapse; font-size: 13px; }
table.stats td, table.stats th { padding: 4px 6px; border-bottom: 1px solid var(--line); text-align: left; }
table.stats .bar { height: 8px; background: linear-gradient(90deg, #f2c14e, #ff7b39); border-radius: 4px; }
.result-head { font-size: 28px; font-weight: 900; }
.result-head.win { color: var(--green); }
.result-head.lose { color: var(--red); }
.mini-board { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; max-width: 360px; }
.mini-board div { aspect-ratio: 1; background: #0004; border-radius: 6px; display: grid; place-items: center; font-size: 20px; position: relative; border: 2px solid transparent; }
.mini-board div small { position: absolute; bottom: -1px; font-size: 9px; color: var(--gold); }
.spellbook-row { display: grid; grid-template-columns: 40px 1fr auto; gap: 8px; align-items: center; padding: 8px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 6px; background: var(--panel); }
.spellbook-row.eq { border-color: #7cc6ff; background: #1f2b3d; }
.spellbook-row .si { font-size: 26px; text-align: center; }
.spellbook-row .sd { font-size: 12px; color: var(--dim); }
.spellbook-row .sx { display: flex; flex-direction: column; gap: 4px; align-items: stretch; }
.spellbook-row select { font: inherit; font-size: 11px; background: var(--bg2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 3px; max-width: 220px; }
.carousel { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 8px; }
.carousel .choice { align-items: center; text-align: center; padding: 8px; }
.carousel .taken-by { font-size: 11px; color: var(--gold); }
.queue { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 10px; font-size: 20px; }
.queue span { padding: 2px 5px; border-radius: 6px; background: #0003; }
.queue span.now { background: var(--gold2); }
.queue span.done { opacity: .3; }
.help-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 18px; font-size: 13px; line-height: 1.55; }
.help-grid kbd { background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font-size: 12px; }

/* 토스트 */
#toasts { position: fixed; left: 50%; top: 60px; transform: translateX(-50%); z-index: 70; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
.toast { background: #000d; border: 1px solid var(--line); padding: 6px 14px; border-radius: 99px; font-size: 13px; animation: toast 2.2s forwards; }
.toast.gold { border-color: var(--gold); color: var(--gold); }
.toast.bad { border-color: var(--red); color: #ffc0c0; }
@keyframes toast { 0% { opacity: 0; transform: translateY(-6px); } 10%, 80% { opacity: 1; transform: none; } 100% { opacity: 0; } }

/* 반응형 */
@media (max-width: 1050px) {
  #layout { grid-template-columns: 1fr; }
  #left, #right { order: 2; }
  #left { display: grid; grid-template-columns: 1fr; }
  #traits { display: flex; flex-wrap: wrap; gap: 4px; }
  #traits .trait { margin: 0; }
  #players { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 4px; }
}
@media (max-width: 640px) {
  #layout { padding: 8px 16px; }
  #topbar { gap: 8px; padding: 6px 10px; }
  .brand span { display: none; }
  #shopBar { flex-wrap: wrap; }
  .shop-actions { flex-direction: row; width: 100%; }
  .shop-actions button { flex: 1; width: auto; }
  #shop { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .shop-card .se { font-size: 24px; }
  .shop-card .st { display: none; }
  #sellZone { width: 100%; padding: 6px; }
  .spell-card { width: 100px; }
  .help-grid { grid-template-columns: 1fr; }
}

</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">👑 <span>일곱 군주의 탁자</span></div>
    <div class="round-info"><span id="roundLabel">1-1</span><span id="roundType" class="pill">몬스터</span></div>
    <div class="stats">
      <div class="stat" title="군주 체력"><span>❤️</span><b id="hpVal">100</b></div>
      <div class="stat" title="골드 (이자: 10골드당 1)"><span>🪙</span><b id="goldVal">0</b><small id="interestVal"></small></div>
      <div class="stat lvl" title="레벨 = 보드 유닛 수"><span>Lv</span><b id="lvlVal">1</b>
        <div class="xpbar"><i id="xpFill"></i></div><small id="xpVal">0/2</small></div>
      <div class="stat" title="연승(+)/연패(-)"><span id="streakIcon">➖</span><b id="streakVal">0</b></div>
    </div>
    <div class="top-actions">
      <button id="btnSpeed" class="ghost" title="전투 속도 (S)">1배속</button>
      <button id="btnHelp" class="ghost" title="도움말 (H)">?</button>
      <button id="btnMenu" class="ghost" title="메뉴">☰</button>
    </div>
  </header>

  <main id="layout">
    <aside id="left">
      <h3>시너지</h3>
      <div id="traits"></div>
      <h3 class="mt">보관함 <small>(유닛에 끌어다 장착)</small></h3>
      <div id="inventory"></div>
      <h3 class="mt">증강</h3>
      <div id="augList"></div>
    </aside>

    <section id="center">
      <div id="boardWrap">
        <canvas id="board"></canvas>
        <div id="banner"></div>
        <div id="aimHint"></div>
      </div>
      <div id="spellBar">
        <div class="lordmana">
          <div class="lm-label">군주 마나 <b id="lmVal">0</b>/<span id="lmMax">10</span></div>
          <div class="lm-bar" id="lmBar"></div>
        </div>
        <div id="spellCards"></div>
        <button id="btnSpellbook" class="ghost small" title="주문서 (B)">📖 주문서</button>
        <button id="btnReady" class="primary" title="준비 완료 (Space)">준비 완료 ▶</button>
      </div>
      <div id="shopBar">
        <div class="shop-actions">
          <button id="btnXp" title="경험치 구매 (F)">⬆ 경험치<br><small>4🪙</small></button>
          <button id="btnRoll" title="새로고침 (D)">🔄 새로고침<br><small>2🪙</small></button>
        </div>
        <div id="shop"></div>
        <div id="sellZone">판매하려면<br>여기로 끌어오기</div>
      </div>
    </section>

    <aside id="right">
      <h3>군주 순위 <small>(클릭해 열람)</small></h3>
      <div id="players"></div>
      <div id="matchInfo"></div>
    </aside>
  </main>

  <div id="tooltip" class="hidden"></div>
  <div id="drag" class="hidden"></div>
  <div id="modal" class="hidden"><div class="modal-box" id="modalBox"></div></div>
  <div id="toasts"></div>
</div>
<script>
/* ===== 00-core.js ===== */
'use strict';
/* =====================================================================
 * 00. 공용 도구 — 시드 기반 난수, 작은 유틸리티
 * ===================================================================== */

// mulberry32: 상태가 정수 하나라서 저장·복원이 쉽다.
class RNG {
  constructor(seed) { this.s = (seed >>> 0) || 1; }
  next() {
    let t = (this.s = (this.s + 0x6D2B79F5) >>> 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  int(n) { return Math.floor(this.next() * n); }
  range(a, b) { return a + this.next() * (b - a); }
  chance(p) { return this.next() < p; }
  pick(arr) { return arr[this.int(arr.length)]; }
  shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) { const j = this.int(i + 1); [arr[i], arr[j]] = [arr[j], arr[i]]; }
    return arr;
  }
  weighted(weights) { // weights: 배열, 인덱스 반환
    let sum = 0; for (const w of weights) sum += w;
    let x = this.next() * sum;
    for (let i = 0; i < weights.length; i++) { x -= weights[i]; if (x < 0) return i; }
    return weights.length - 1;
  }
}

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const cheb = (r1, c1, r2, c2) => Math.max(Math.abs(r1 - r2), Math.abs(c1 - c2));
const sum = arr => arr.reduce((a, b) => a + b, 0);
const $ = sel => document.querySelector(sel);
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));

// 시너지 단계: 0 = 미발동, 1~3 = 2/4/6명 단계
function traitTier(trait, count) {
  const t = TRAITS[trait].tiers;
  let tier = 0;
  for (let i = 0; i < t.length; i++) if (count >= t[i]) tier = i + 1;
  return tier;
}

// 보드 유닛 목록 → 시너지 카운트 (서로 다른 유닛만, 문장 증강 반영)
function computeTraits(boardUnits, aug) {
  const seen = new Set();
  const counts = {};
  for (const u of boardUnits) {
    if (seen.has(u.defId)) continue;
    seen.add(u.defId);
    const d = UNITS[u.defId];
    if (!d) continue;
    for (const t of d.traits) counts[t] = (counts[t] || 0) + 1;
  }
  if (aug) for (const a of aug) if (a.id === 'emblem' && counts[a.param]) counts[a.param] += 1;
  return counts;
}

function itemKey(a, b) { return [a, b].sort().join('+'); }
function itemInfo(item) {
  // item: 'sword' (재료) 또는 'bow+sword' (완성)
  if (COMPONENTS[item]) {
    const c = COMPONENTS[item];
    return { name: c.name, icon: c.icon, desc: c.desc, stats: { ...c.stats }, fx: null, component: true };
  }
  const [a, b] = item.split('+');
  const stats = {};
  for (const k of [a, b]) for (const [s, v] of Object.entries(COMPONENTS[k].stats)) stats[s] = (stats[s] || 0) + v * 1.2;
  const u = UNIQUE_ITEMS[item];
  if (u) return { name: u.name, icon: u.icon, desc: u.desc, stats, fx: u.fx, component: false };
  return { name: `${COMPONENTS[a].name}·${COMPONENTS[b].name} 합성구`, icon: '🔶', desc: '재료 능력치 합산(×1.2)', stats, fx: null, component: false };
}
function statText(stats) {
  const L = { atk: '공격력', as: '공속', armor: '방어', mr: '마저', ap: '스킬피해', mana: '마나', hp: '체력', crit: '치명' };
  return Object.entries(stats).map(([k, v]) => {
    const pct = (k === 'as' || k === 'crit');
    return `${L[k]} +${pct ? Math.round(v * 100) + '%' : Math.round(v)}${k === 'ap' ? '%' : ''}`;
  }).join(', ');
}

/* =====================================================================
 * 03. 전투 엔진 (1/2) — 준비, 능력치 계산, 피해·회복 같은 효과 기본 단위
 *     화면 그리기와 완전히 분리되어 있어 플레이어 전투(애니메이션)와
 *     AI끼리의 전투(화면 없이)를 같은 코드로 돌린다.
 * ===================================================================== */

const GROWS = 8, GCOLS = 7;
// side 0 = 아래쪽(행 4~7), side 1 = 위쪽(행 0~3). 로컬 행 0이 앞줄.
function toGlobal(side, r, c) { return side === 0 ? [4 + r, c] : [3 - r, 6 - c]; }

/*
 * 진영 명세(spec):
 * { name, emoji, isPlayer, units:[{defId,star,items,r,c}], traits:{}, aug:[{id,param}],
 *   lordType, spells:[{id,lvl,rule}], ai:{tend,castDelay,mult}|null, forceAuto, monsterScale }
 */
function createBattle(specA, specB, seed, opts = {}) {
  const B = {
    tick: 0, maxTick: Math.round(CFG.BATTLE_TIME / CFG.TICK),
    rng: new RNG(seed), units: [], zones: [], ev: [], queue: [], log: [],
    occ: Array.from({ length: GROWS }, () => new Array(GCOLS).fill(0)),
    headless: !!opts.headless, over: false, result: null, uidN: 1,
    amp: 1, // 연장전 피해 배율
  };
  B.sides = [makeSideState(specA, 0), makeSideState(specB, 1)];
  for (const S of B.sides) {
    for (const s of S.spec.units) {
      const [gr, gc] = toGlobal(S.idx, s.r, s.c);
      if (B.occ[gr][gc]) continue;
      spawnUnit(B, S.idx, s.defId, s.star, s.items || [], gr, gc, s.r, S.spec.monsterScale || 1);
    }
  }
  startEffects(B);
  return B;
}

function makeSideState(spec, idx) {
  const aug = new Set((spec.aug || []).map(a => a.id));
  const tiers = {};
  for (const t of TRAIT_KEYS) tiers[t] = traitTier(t, (spec.traits || {})[t] || 0);
  const S = {
    idx, spec, name: spec.name, emoji: spec.emoji, isPlayer: !!spec.isPlayer, tiers, aug,
    lordType: spec.lordType, lm: aug.has('manaHead') ? 3 : 0,
    lmMax: aug.has('manaVault') ? 14 : CFG.LORD_MANA_MAX,
    lmRegen: (tiers.star === 3 ? 1.6 : 1) * (aug.has('manaSpring') ? 1.3 : 1),
    healAmp: (1 + [0, 0.25, 0.5, 0.9][tiers.healer]) * (aug.has('mercy') ? 1.25 : 1),
    phoenixUsed: false, lastStandDone: false,
    spellDmgMult: 1 + (spec.lordType === 'war' ? 0.15 : 0) + [0, 0, 0.15, 0.3][tiers.mystic],
    spellMult: aug.has('spellAmp') ? 1.2 : 1,
    spells: (spec.spells || []).map(s => ({ id: s.id, lvl: s.lvl, rule: s.rule || 'off', cd: 0, used: false })),
    castCount: 0, forceAuto: !!spec.forceAuto, ai: spec.ai || null, aiWait: 0, aiArmed: false,
    stats: { spellDmg: 0, spellHeal: 0, spellShield: 0, casts: 0 },
  };
  return S;
}

function spawnUnit(B, side, defId, star, items, gr, gc, localRow, scale = 1) {
  const d = unitDef(defId);
  const S = B.sides[side];
  const m = CFG.STAR_MULT[star] || 1;
  const u = {
    uid: B.uidN++, side, defId, d, star, items: items.slice(), r: gr, c: gc, fr: gr, fc: gc,
    maxHp: d.hp * m * scale, atk: d.atk * m * scale, as: d.as, asBonus: 0, range: d.range,
    armor: d.armor, mr: d.mr, ap: 0, crit: d.crit, critDmg: 1.5, manaMax: d.mana, mana: d.startMana,
    dmgAmp: 0, lifesteal: 0, regen: 0, fx: new Set(), traits: d.traits || [],
    alive: true, ghost: 0, ghostT: 0, ghostMult: 0, reviving: 0, revive: false,
    stun: 0, freeze: 0, undying: 0, taunt: 0, sunder: null, burn: null,
    slows: [], buffs: [], shields: [],
    target: null, atkCd: 0.25 + B.rng.next() * 0.35, moveCd: 0, moveDur: CFG.MOVE_TIME, retargetT: 0,
    atkCount: 0, asStacks: 0, fireBurn: 0, frostSlow: 0, distAmp: 0, leap: false, leapStun: false,
    thornDmg: 0, spellVamp: 0, manaPerAtk: 0, armorPen: 0, mrPen: 0, giantAmp: 0, execAmp: 0,
    burnHitDps: 0, asRamp: false, startShield: 0, reviveHp: 400,
    dmgDone: 0, dmgTaken: 0, healDone: 0, summon: !!d.summon, monster: defId.startsWith('m_'),
  };
  // 아이템
  for (const it of u.items) {
    const info = itemInfo(it);
    const st = info.stats;
    u.atk += st.atk || 0; u.asBonus += st.as || 0; u.armor += st.armor || 0; u.mr += st.mr || 0;
    u.ap += st.ap || 0; u.mana += st.mana || 0; u.maxHp += st.hp || 0; u.crit += st.crit || 0;
    if (info.fx) u.fx.add(info.fx);
  }
  if (u.fx.has('critDmg')) u.critDmg += 0.4;
  if (u.fx.has('bigAp')) u.ap += 40;
  if (u.fx.has('lifesteal')) u.lifesteal += 0.25;
  if (u.fx.has('dmgAmp')) u.dmgAmp += 0.15;
  if (u.fx.has('regen')) u.regen += 0.03;
  if (u.fx.has('revive')) u.revive = true;
  if (u.fx.has('thorns')) u.thornDmg += 25;
  if (u.fx.has('spellVamp')) u.spellVamp += 0.2;
  if (u.fx.has('manaHit')) u.manaPerAtk += 6;
  if (u.fx.has('burnHit')) u.burnHitDps = 20;
  applyTraitBonuses(S, u);
  // 증강
  const A = S.aug;
  if (A.has('frontline') && localRow === 0) u.maxHp *= 1.2;
  if (A.has('backline') && localRow >= 2) u.atk *= 1.15;
  if (A.has('critAll')) u.crit += 0.15;
  if (A.has('armorAll')) { u.armor += 20; u.mr += 20; }
  if (A.has('apAll')) u.ap += 20;
  if (A.has('regenAll')) u.regen += 0.015;
  if (A.has('manaStart')) u.mana += 20;
  if (A.has('swift')) u.asBonus += 0.15;
  if (A.has('giant')) u.maxHp *= 1.12;
  if (A.has('lifesteal')) u.lifesteal += 0.10;
  // 확장 증강
  const cost = d.cost || 0;
  if (A.has('commonPower') && cost >= 1 && cost <= 2) { u.maxHp *= 1.2; u.atk *= 1.2; }
  if (A.has('nobleBlood') && cost >= 4) u.ap += 30;
  if (A.has('eliteFew') && S.spec.units.length <= 5) { u.maxHp *= 1.25; u.atk *= 1.25; }
  if (A.has('precision')) u.critDmg += 0.35;
  if (A.has('thornsAll')) u.thornDmg += 12;
  if (A.has('spellVampAll')) u.spellVamp += 0.15;
  if (A.has('manaFlow')) u.manaPerAtk += 3;
  if (A.has('armorPierce')) u.armorPen = 0.35;
  if (A.has('magicPierce')) u.mrPen = 0.35;
  if (A.has('giantSlayer')) u.giantAmp = 0.25;
  if (A.has('executioner')) u.execAmp = 0.25;
  if (A.has('arsonist')) u.burnHitDps = Math.max(u.burnHitDps, 12);
  if (A.has('accelerate')) u.asRamp = true;
  if (A.has('tankShield') && localRow === 0) u.startShield += 300;
  if (A.has('backShield') && localRow >= 2) u.startShield += 220;
  if (A.has('phalanx') && gc >= 2 && gc <= 4) { u.armor += 25; u.mr += 25; }
  if (A.has('flanking') && (gc <= 1 || gc >= 5)) u.asBonus += 0.2;
  if (A.has('legion')) { u.ghostT = Math.max(u.ghostT, 2); u.ghostMult = Math.max(u.ghostMult, 0.5); }
  u.hp = u.maxHp;
  u.crit = Math.min(u.crit, 1);
  B.units.push(u);
  B.occ[gr][gc] = u.uid;
  return u;
}

function applyTraitBonuses(S, u) {
  const T = S.tiers;
  const has = t => u.traits.includes(t);
  const origin = t => T[t] === 3 || (T[t] > 0 && has(t)); // 6단계는 모든 아군
  if (origin('fire')) u.fireBurn = [0, 15, 35, 70][T.fire];
  if (origin('frost')) u.frostSlow = [0, 0.15, 0.25, 0.40][T.frost];
  if (origin('forest')) u.regen += [0, 0.02, 0.035, 0.06][T.forest];
  if (origin('wraith')) { u.ghostT = [0, 2, 3, 5][T.wraith]; u.ghostMult = [0, 0.5, 0.7, 1][T.wraith]; }
  if (origin('mech')) u.mechShield = [0, 180, 380, 750][T.mech];
  if (origin('star')) u.manaMax = Math.round(u.manaMax * (1 - [0, 0.15, 0.25, 0.35][T.star]));
  if (T.guardian) {
    const b = has('guardian') ? [0, 20, 40, 70][T.guardian] : [0, 0, 10, 25][T.guardian];
    u.armor += b; u.mr += b;
  }
  if (T.vanguard && has('vanguard')) {
    u.leap = true; u.atk *= 1 + [0, 0.15, 0.30, 0.55][T.vanguard]; u.leapStun = T.vanguard === 3;
  }
  if (T.sniper && has('sniper')) { u.range += T.sniper === 3 ? 2 : 1; u.distAmp = [0, 0.05, 0.08, 0.12][T.sniper]; }
  if (T.mystic && has('mystic')) u.ap += [0, 20, 45, 80][T.mystic];
  if (T.assassin && has('assassin')) { u.crit += [0, 0.15, 0.30, 0.45][T.assassin]; u.critDmg += [0, 0.25, 0.45, 0.7][T.assassin]; }
}

function startEffects(B) {
  // 증원군: 자기 진영 앞쪽 빈 칸에 강철 병사 소환
  for (const S of B.sides) if (S.aug.has('reinforce')) {
    for (let i = 0; i < 2; i++) {
      const free = [];
      for (let r = 0; r < CFG.ROWS; r++) for (let c = 0; c < CFG.COLS; c++) {
        const [gr, gc] = toGlobal(S.idx, r, c);
        if (!B.occ[gr][gc]) free.push([gr, gc, r]);
      }
      if (!free.length) break;
      free.sort((a, b) => a[2] - b[2] || Math.abs(a[1] - 3) - Math.abs(b[1] - 3));
      const [gr, gc] = free[0];
      spawnUnit(B, S.idx, 'militia', 1, [], gr, gc, 0);
    }
  }
  for (const u of B.units) {
    if (u.mechShield) addShield(B, u, u.mechShield, 999, null);
    if (u.startShield) addShield(B, u, u.startShield, 999, null);
    if (u.fx.has('locket')) for (const a of alliesOf(B, u.side)) if (cheb(a.r, a.c, u.r, u.c) <= 1) addShield(B, a, 200, 8, null);
  }
  for (const S of B.sides) {
    const mine = alliesOf(B, S.idx);
    if (S.aug.has('firstStrike')) for (const u of mine) addBuff(u, 'as', 0.4, 4);
    if (S.aug.has('oath') && mine.length) {
      const tank = mine.reduce((a, b) => (b.maxHp > a.maxHp ? b : a));
      tank.taunt = 4; addBuff(tank, 'armor', 30, 4);
    }
    if (S.aug.has('stunStart')) for (const e of B.rng.shuffle(enemiesOf(B, S.idx)).slice(0, 2)) applyStun(B, e, 1.5);
    if (S.aug.has('ambush')) for (const u of mine) if (u.traits.includes('assassin')) u.leap = true;
  }
  for (const u of B.units) if (u.leap) {
    const far = farthestFrom(B, u, enemiesOf(B, u.side));
    if (far) {
      leapNear(B, u, far);
      if (u.leapStun) for (const e of enemiesOf(B, u.side)) if (cheb(e.r, e.c, u.r, u.c) <= 1) applyStun(B, e, 1);
    }
  }
}

/* ---------- 조회 도구 ---------- */
const targetable = u => u.alive && u.reviving <= 0;
function alliesOf(B, side) { return B.units.filter(u => u.side === side && targetable(u)); }
function enemiesOf(B, side) { return B.units.filter(u => u.side !== side && targetable(u)); }
function unitByUid(B, uid) { return B.units.find(u => u.uid === uid); }
function farthestFrom(B, u, list) {
  let best = null, bd = -1;
  for (const e of list) { const d = cheb(u.r, u.c, e.r, e.c) * 10 + Math.abs(u.c - e.c); if (d > bd) { bd = d; best = e; } }
  return best;
}
function nearestTo(r, c, list) {
  let best = null, bd = 1e9;
  for (const e of list) {
    const d = cheb(r, c, e.r, e.c) + ((e.r - r) ** 2 + (e.c - c) ** 2) * 0.001 + e.uid * 1e-6;
    if (d < bd) { bd = d; best = e; }
  }
  return best;
}
function freeCellsNear(B, r, c, maxR = 3) {
  const out = [];
  for (let rad = 1; rad <= maxR; rad++) {
    for (let rr = r - rad; rr <= r + rad; rr++) for (let cc = c - rad; cc <= c + rad; cc++) {
      if (rr < 0 || cc < 0 || rr >= GROWS || cc >= GCOLS) continue;
      if (cheb(r, c, rr, cc) !== rad || B.occ[rr][cc]) continue;
      out.push([rr, cc]);
    }
    if (out.length) return out;
  }
  return out;
}
function placeUnit(B, u, r, c, instant) {
  B.occ[u.r][u.c] = 0;
  u.fr = instant ? r : u.r; u.fc = instant ? c : u.c;
  u.r = r; u.c = c;
  B.occ[r][c] = u.uid;
}
function leapNear(B, u, tgt) {
  const cells = freeCellsNear(B, tgt.r, tgt.c, 3);
  if (!cells.length) return false;
  cells.sort((a, b) => cheb(a[0], a[1], tgt.r, tgt.c) - cheb(b[0], b[1], tgt.r, tgt.c) || Math.abs(a[1] - u.c) - Math.abs(b[1] - u.c));
  const [r, c] = cells[0];
  const from = [u.r, u.c];
  placeUnit(B, u, r, c, true);
  u.target = tgt;
  emit(B, { t: 'leap', uid: u.uid, from, to: [r, c] });
  return true;
}
function emit(B, e) { if (!B.headless) B.ev.push(e); }

/* ---------- 능력치 ---------- */
function buffSum(u, stat) { let s = 0; for (const b of u.buffs) if (b.stat === stat) s += b.v; return s; }
function maxSlow(u, move) { let s = 0; for (const x of u.slows) if (!move || x.move) s = Math.max(s, x.v); return s; }
function effAtk(u) {
  let m = 1 + buffSum(u, 'atk');
  if (u.fx.has('rage') && u.hp < u.maxHp * 0.5) m += 0.35;
  return u.atk * m;
}
function effAS(u) {
  const a = u.as * (1 + u.asBonus + buffSum(u, 'as') + u.asStacks * 0.06) * (1 - maxSlow(u, false));
  return clamp(a, 0.2, 5);
}
function effArmor(u) { return (u.armor + buffSum(u, 'armor')) * (u.sunder ? 0.5 : 1); }
function effMr(u) { return u.mr + buffSum(u, 'mr'); }

/* ---------- 효과 기본 단위 ---------- */
// src: 공격·시전한 유닛(없으면 null), o: {attack, skill, spellSide, crit, reflect, trueDmg}
function dealDamage(B, src, tgt, raw, kind, o = {}) {
  if (!targetable(tgt) || raw <= 0) return 0;
  if (o.attack && tgt.fx.has('dodge') && B.rng.chance(0.2)) { emit(B, { t: 'miss', uid: tgt.uid }); return 0; }
  let d = raw;
  if (src) {
    d *= 1 + src.dmgAmp;
    if (src.giantAmp && tgt.maxHp >= 1500) d *= 1 + src.giantAmp;
    if (src.execAmp && tgt.hp <= tgt.maxHp * 0.35) d *= 1 + src.execAmp;
  }
  if (kind !== 'true') d *= B.amp;
  if (kind === 'phys') d *= 100 / (100 + Math.max(0, effArmor(tgt) * (1 - (src ? src.armorPen : 0))));
  else if (kind === 'magic') d *= 100 / (100 + Math.max(0, effMr(tgt) * (1 - (src && o.skill ? src.mrPen : 0))));
  if (tgt.sunder) d *= 1 + tgt.sunder.amp;
  let left = d;
  for (const s of tgt.shields) { const a = Math.min(s.amt, left); s.amt -= a; left -= a; if (left <= 0) break; }
  tgt.shields = tgt.shields.filter(s => s.amt > 0.5);
  tgt.hp -= left;
  tgt.dmgTaken += d;
  if (src) src.dmgDone += d;
  if (o.spellSide != null) B.sides[o.spellSide].stats.spellDmg += d;
  if (o.attack) tgt.mana = Math.min(tgt.manaMax, tgt.mana + 5);
  else if (o.skill) tgt.mana = Math.min(tgt.manaMax, tgt.mana + 2);
  emit(B, { t: 'dmg', uid: tgt.uid, a: d, crit: !!o.crit, kind, spell: o.spellSide != null });
  if (src && targetable(src)) {
    if (o.attack && src.lifesteal) healUnit(B, src, src, d * src.lifesteal, true);
    if (o.skill && src.spellVamp) healUnit(B, src, src, d * src.spellVamp, true);
    if (o.attack && tgt.fireBurn) applyBurn(B, src, tgt.fireBurn, 3);
    if (o.attack && tgt.thornDmg && !o.reflect) dealDamage(B, tgt, src, tgt.thornDmg, 'magic', { reflect: true });
  }
  if (tgt.hp <= 0) onLethal(B, tgt, src);
  return d;
}

function onLethal(B, u, killer) {
  if (u.undying > 0) { u.hp = 1; return; }
  const S = B.sides[u.side];
  // 불사조의 깃털: 전투마다 처음 쓰러진 아군 1명 부활
  if (!u.revive && !u.summon && S.aug.has('phoenixFeather') && !S.phoenixUsed) {
    S.phoenixUsed = true; u.revive = true; u.reviveHp = u.maxHp * 0.5;
  }
  if (u.revive) {
    u.revive = false; u.alive = false; u.reviving = 1; u.hp = 0;
    u.shields = []; u.burn = null;
    emit(B, { t: 'reviveStart', uid: u.uid });
    return;
  }
  u.alive = false; u.hp = 0; u.shields = []; u.burn = null;
  B.occ[u.r][u.c] = 0;
  emit(B, { t: 'death', uid: u.uid });
  if (!u.summon) S.lm = Math.min(S.lmMax, S.lm + (S.aug.has('sacrifice') ? 2 : 1));
  if (u.ghostT > 0 && !u.summon) { u.ghost = u.ghostT; emit(B, { t: 'ghost', uid: u.uid }); }
  // 처치한 쪽 효과
  if (killer && killer.side !== u.side) {
    const KS = B.sides[killer.side];
    if (KS.aug.has('huntMana')) KS.lm = Math.min(KS.lmMax, KS.lm + 1);
    if (targetable(killer)) {
      if (KS.aug.has('killHeal')) healUnit(B, killer, killer, killer.maxHp * 0.25, true);
      if (KS.aug.has('soulDrink') && killer.d.skill) killer.mana = Math.min(killer.manaMax, killer.mana + 40);
    }
  }
  // 최후의 저항: 남은 아군이 3명 이하가 되면
  if (S.aug.has('lastStand') && !S.lastStandDone) {
    const left = alliesOf(B, u.side).filter(x => !x.summon);
    if (left.length && left.length <= 3) {
      S.lastStandDone = true;
      for (const a of left) { addBuff(a, 'atk', 0.35, 99); emit(B, { t: 'laststand', uid: a.uid }); }
    }
  }
}

function healUnit(B, src, tgt, amt, raw) {
  if (!targetable(tgt) || amt <= 0) return 0;
  const S = B.sides[tgt.side];
  const a = Math.min(tgt.maxHp - tgt.hp, raw ? amt : amt * S.healAmp);
  if (a <= 0) return 0;
  tgt.hp += a;
  if (src) src.healDone += a;
  if (a >= 25) emit(B, { t: 'heal', uid: tgt.uid, a });
  return a;
}
function addShield(B, tgt, amt, dur, src) {
  if (!targetable(tgt)) return 0;
  const a = src === null ? amt : amt * B.sides[tgt.side].healAmp;
  tgt.shields.push({ amt: a, t: dur });
  emit(B, { t: 'shield', uid: tgt.uid, a });
  return a;
}
function applyStun(B, tgt, dur) {
  if (!targetable(tgt) || tgt.fx.has('ccImmune')) return;
  tgt.stun = Math.max(tgt.stun, dur);
  emit(B, { t: 'stun', uid: tgt.uid, dur });
}
function applySlow(B, tgt, v, dur, move) {
  if (!targetable(tgt)) return;
  tgt.slows.push({ v, t: dur, move: !!move });
}
function applyBurn(B, tgt, dps, dur, spellSide) {
  if (!targetable(tgt)) return;
  if (!tgt.burn || tgt.burn.dps <= dps) tgt.burn = { dps, t: dur, spellSide };
  else tgt.burn.t = Math.max(tgt.burn.t, dur);
}
function addBuff(tgt, stat, v, dur) { if (targetable(tgt)) tgt.buffs.push({ stat, v, t: dur }); }

/* ===== 04-combat2.js ===== */
/* =====================================================================
 * 04. 전투 엔진 (2/2) — 틱 진행, A* 경로, 공격·스킬, 종료 판정
 * ===================================================================== */

function stepBattle(B) {
  if (B.over) return;
  const dt = CFG.TICK;
  B.tick++;
  const dot = B.tick % 5 === 0; // 지속 피해·회복은 0.5초마다
  // 연장전: 15초 이후 모든 피해가 초당 8%씩 증가해 시간 초과를 드물게 만든다
  const time = B.tick * dt;
  if (time > CFG.OVERTIME) {
    if (B.amp === 1) emit(B, { t: 'overtime' });
    B.amp = 1 + (time - CFG.OVERTIME) * CFG.OVERTIME_RAMP;
  }

  // 1) 군주 마나, 주문 재사용 대기, 입력된 주문 이벤트, 자동/AI 시전
  for (const S of B.sides) {
    S.lm = Math.min(S.lmMax, S.lm + CFG.LORD_MANA_REGEN * S.lmRegen * dt);
    for (const sl of S.spells) if (sl.cd > 0) sl.cd = Math.max(0, sl.cd - dt);
  }
  const q = B.queue; B.queue = [];
  for (const e of q) castSpell(B, e.side, e.slot, e.target, false);
  for (const S of B.sides) autoCastTick(B, S, dt);

  // 2) 화염 지대
  for (const z of B.zones) {
    z.t -= dt;
    if (dot) for (const e of enemiesOf(B, z.side)) if (e.r === z.row) dealDamage(B, null, e, z.dps * 0.5, 'magic', { spellSide: z.side });
  }
  B.zones = B.zones.filter(z => z.t > 0);

  // 3) 유닛 (매 틱 순서를 섞어 진영 편향 제거)
  const order = B.rng.shuffle(B.units.filter(u => u.alive || u.ghost > 0 || u.reviving > 0));
  for (const u of order) updateUnit(B, u, dt, dot);

  // 4) 종료 판정
  const live = [0, 0];
  for (const u of B.units) if ((u.alive || u.reviving > 0) && !u.summon) live[u.side]++;
  const liveAny = [0, 0];
  for (const u of B.units) if (u.alive || u.reviving > 0) liveAny[u.side]++;
  if (!liveAny[0] || !liveAny[1] || !live[0] || !live[1]) {
    const w = (live[0] && !live[1]) ? 0 : (live[1] && !live[0]) ? 1 : -1;
    finishBattle(B, w, false);
  } else if (B.tick >= B.maxTick) finishBattle(B, -1, true);
}

function finishBattle(B, winner, timeout) {
  B.over = true;
  const survivors = [[], []];
  for (const u of B.units) if ((u.alive || u.reviving > 0) && !u.summon) survivors[u.side].push({ star: u.star, cost: u.d.cost });
  B.result = { winner, timeout, survivors, ticks: B.tick };
  emit(B, { t: 'end', winner, timeout });
}

function runBattle(specA, specB, seed) {
  const B = createBattle(specA, specB, seed, { headless: true });
  let guard = 0;
  while (!B.over && guard++ < 1000) stepBattle(B);
  return B;
}

function updateUnit(B, u, dt, dot) {
  if (u.reviving > 0) {
    u.reviving -= dt;
    if (u.reviving <= 0) { u.alive = true; u.hp = Math.min(u.maxHp, u.reviveHp); emit(B, { t: 'revive', uid: u.uid }); }
    return;
  }
  if (u.ghost > 0) {
    u.ghost -= dt;
    if (u.ghost <= 0) { emit(B, { t: 'ghostEnd', uid: u.uid }); return; }
    ghostAct(B, u, dt);
    return;
  }
  // 상태 타이머
  u.stun = Math.max(0, u.stun - dt); u.freeze = Math.max(0, u.freeze - dt);
  u.undying = Math.max(0, u.undying - dt); u.taunt = Math.max(0, u.taunt - dt);
  if (u.sunder && (u.sunder.t -= dt) <= 0) u.sunder = null;
  for (const b of u.buffs) b.t -= dt; u.buffs = u.buffs.filter(b => b.t > 0);
  for (const s of u.slows) s.t -= dt; u.slows = u.slows.filter(s => s.t > 0);
  for (const s of u.shields) s.t -= dt; u.shields = u.shields.filter(s => s.t > 0);
  if (dot) {
    if (u.burn) {
      dealDamage(B, null, u, u.burn.dps * 0.5, 'magic', { spellSide: u.burn.spellSide });
      if (u.burn && (u.burn.t -= 0.5) <= 0) u.burn = null;
    }
    if (u.regen && u.alive) healUnit(B, null, u, u.maxHp * u.regen * 0.5, true);
    if (u.asRamp) u.asBonus += 0.015;
    if (u.fx.has('frostAura')) for (const e of enemiesOf(B, u.side)) if (cheb(e.r, e.c, u.r, u.c) <= 2) applySlow(B, e, 0.25, 0.6);
  }
  if (!u.alive) return;
  if (u.stun > 0 || u.freeze > 0) return;
  if (u.moveCd > 0) { u.moveCd -= dt; return; }

  // 대상 선정 (도발 우선)
  const foes = enemiesOf(B, u.side);
  if (!foes.length) return;
  const taunter = foes.find(e => e.taunt > 0 && cheb(e.r, e.c, u.r, u.c) <= 2);
  if (taunter) u.target = taunter;
  u.retargetT -= dt;
  if (!u.target || !targetable(u.target) || (u.retargetT <= 0 && cheb(u.r, u.c, u.target.r, u.target.c) > u.range)) {
    u.target = nearestTo(u.r, u.c, foes);
    u.retargetT = 1;
  }
  const t = u.target;
  if (!t) return;

  // 스킬
  if (u.d.skill && u.mana >= u.manaMax) { castSkill(B, u); return; }

  const dist = cheb(u.r, u.c, t.r, t.c);
  if (dist <= u.range) {
    u.atkCd -= dt;
    if (u.atkCd <= 0) { attack(B, u, t, dist); u.atkCd += 1 / effAS(u); }
  } else {
    const step = findStep(B, u, t);
    if (step) {
      placeUnit(B, u, step[0], step[1], false);
      u.moveDur = CFG.MOVE_TIME / Math.max(0.2, 1 - maxSlow(u, true));
      u.moveCd = u.moveDur;
      u.atkCd = Math.max(u.atkCd, 0.15);
    } else {
      // 길이 막혔으면 다른 적을 노린다
      const alt = foes.filter(e => e !== t).sort((a, b) => cheb(u.r, u.c, a.r, a.c) - cheb(u.r, u.c, b.r, b.c))[0];
      if (alt && B.rng.chance(0.3)) u.target = alt;
    }
  }
}

// A* 탐색: 목표 = 대상과의 거리가 사거리 이내인 빈 칸. 휴리스틱 = max(0, 체비셰프 거리 - 사거리)
function findStep(B, u, t) {
  const N = GROWS * GCOLS;
  const g = new Float32Array(N).fill(1e9);
  const from = new Int16Array(N).fill(-1);
  const closed = new Uint8Array(N);
  const start = u.r * GCOLS + u.c;
  const h = (r, c) => Math.max(0, cheb(r, c, t.r, t.c) - u.range);
  g[start] = 0;
  const open = [start];
  let goal = -1;
  while (open.length) {
    let bi = 0, bf = 1e9;
    for (let i = 0; i < open.length; i++) {
      const n = open[i], f = g[n] + h((n / GCOLS) | 0, n % GCOLS);
      if (f < bf) { bf = f; bi = i; }
    }
    const cur = open.splice(bi, 1)[0];
    if (closed[cur]) continue;
    closed[cur] = 1;
    const cr = (cur / GCOLS) | 0, cc = cur % GCOLS;
    if (cur !== start && cheb(cr, cc, t.r, t.c) <= u.range) { goal = cur; break; }
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
      if (!dr && !dc) continue;
      const nr = cr + dr, nc = cc + dc;
      if (nr < 0 || nc < 0 || nr >= GROWS || nc >= GCOLS) continue;
      if (B.occ[nr][nc]) continue;
      const n = nr * GCOLS + nc;
      const cost = g[cur] + (dr && dc ? 1.02 : 1); // 대각선을 아주 약간 비싸게 해서 곧은 경로 선호
      if (cost < g[n]) { g[n] = cost; from[n] = cur; open.push(n); }
    }
  }
  if (goal < 0) return null;
  let n = goal;
  while (from[n] !== start && from[n] >= 0) n = from[n];
  return [(n / GCOLS) | 0, n % GCOLS];
}

function attack(B, u, t, dist) {
  u.atkCount++;
  let dmg = effAtk(u);
  if (u.distAmp) dmg *= 1 + u.distAmp * dist;
  const crit = B.rng.chance(u.crit);
  if (crit) dmg *= u.critDmg;
  emit(B, { t: 'atk', uid: u.uid, tuid: t.uid, ranged: u.range > 1 });
  dealDamage(B, u, t, dmg, 'phys', { attack: true, crit });
  u.mana = Math.min(u.manaMax, u.mana + 10 + u.manaPerAtk);
  if (u.fx.has('asRamp')) u.asStacks = Math.min(10, u.asStacks + 1);
  if (u.frostSlow) applySlow(B, t, u.frostSlow, 2, false);
  if (u.burnHitDps) applyBurn(B, t, u.burnHitDps, 3);
  if (u.fx.has('zap') && u.atkCount % 3 === 0) {
    const others = enemiesOf(B, u.side).filter(e => e !== t).sort((a, b) => cheb(a.r, a.c, t.r, t.c) - cheb(b.r, b.c, t.r, t.c)).slice(0, 2);
    for (const e of [t, ...others]) { emit(B, { t: 'zap', uid: u.uid, tuid: e.uid }); dealDamage(B, u, e, 70, 'magic', { skill: true }); }
  }
}

function ghostAct(B, u, dt) {
  const foes = enemiesOf(B, u.side);
  if (!foes.length) return;
  if (!u.target || !targetable(u.target)) u.target = nearestTo(u.r, u.c, foes);
  u.atkCd -= dt;
  if (u.atkCd <= 0) {
    u.atkCd += 1 / effAS(u);
    emit(B, { t: 'atk', uid: u.uid, tuid: u.target.uid, ranged: true, ghost: true });
    dealDamage(B, u, u.target, effAtk(u) * u.ghostMult, 'phys', { attack: true });
  }
}

/* ---------- 유닛 스킬 ---------- */
function castSkill(B, u) {
  const sk = u.d.skill;
  u.mana = u.fx.has('blueBuff') ? 25 : 0;
  emit(B, { t: 'skill', uid: u.uid, name: sk.name });
  const ctx = { side: u.side, caster: u, idx: u.star - 1, mult: 1 + u.ap / 100, last: [] };
  for (const fx of sk.fx) runSkillFx(B, ctx, fx);
}

function selectTargets(B, ctx, fx) {
  const u = ctx.caster, side = ctx.side;
  const foes = enemiesOf(B, side), friends = alliesOf(B, side);
  const ratio = x => x.hp / x.maxHp;
  switch (fx.tgt) {
    case 'self': return [u];
    case 'target': return u.target && targetable(u.target) ? [u.target] : (foes.length ? [nearestTo(u.r, u.c, foes)] : []);
    case 'area': { const c = u.target && targetable(u.target) ? u.target : nearestTo(u.r, u.c, foes); return c ? foes.filter(e => cheb(e.r, e.c, c.r, c.c) <= (fx.r || 1)) : []; }
    case 'selfArea': return foes.filter(e => cheb(e.r, e.c, u.r, u.c) <= (fx.r || 1));
    case 'lowestAlly': return friends.sort((a, b) => ratio(a) - ratio(b)).slice(0, 1);
    case 'lowestAllies': return friends.sort((a, b) => ratio(a) - ratio(b)).slice(0, fx.n || 2);
    case 'allAllies': return friends;
    case 'allEnemies': return foes;
    case 'lowestEnemy': return foes.sort((a, b) => a.hp - b.hp).slice(0, 1);
    case 'randomEnemies': return B.rng.shuffle(foes).slice(0, fx.n || 3);
    case 'farthestEnemy': { const f = farthestFrom(B, u, foes); return f ? [f] : []; }
    case 'last': return ctx.last.filter(targetable);
  }
  return [];
}

function runSkillFx(B, ctx, fx) {
  const u = ctx.caster;
  const v = fx.v ? fx.v[ctx.idx] : 0;
  if (fx.t === 'summon') {
    const n = fx.n || 1;
    for (let i = 0; i < n; i++) {
      const cells = freeCellsNear(B, u.r, u.c, 3);
      if (!cells.length) break;
      const [r, c] = B.rng.pick(cells);
      const s = spawnUnit(B, u.side, fx.unit, u.star, [], r, c, 1);
      emit(B, { t: 'summon', uid: s.uid });
    }
    return;
  }
  if (fx.t === 'leap') {
    const tg = selectTargets(B, ctx, fx)[0];
    if (tg) leapNear(B, u, tg);
    return;
  }
  const targets = selectTargets(B, ctx, fx);
  if (fx.t === 'dmg' || fx.t === 'burn' || fx.t === 'stun' || fx.t === 'slow' || fx.t === 'execute') ctx.last = targets;
  for (const tg of targets) {
    switch (fx.t) {
      case 'dmg': {
        let d = v * ctx.mult;
        let crit = false;
        if (u.fx.has('skillCrit') && B.rng.chance(u.crit)) { d *= u.critDmg; crit = true; }
        emit(B, { t: 'skillHit', uid: u.uid, tuid: tg.uid });
        dealDamage(B, u, tg, d, fx.kind || 'magic', { skill: true, crit });
        break;
      }
      case 'burn': applyBurn(B, tg, v * ctx.mult, fx.dur || 3); break;
      case 'stun': applyStun(B, tg, v); break;
      case 'slow': applySlow(B, tg, v, fx.dur || 2, false); break;
      case 'heal': healUnit(B, u, tg, v * ctx.mult); break;
      case 'shield': addShield(B, tg, v * ctx.mult, fx.dur || 4, u); break;
      case 'buff': addBuff(tg, fx.stat, v, fx.dur || 4); break;
      case 'mana': if (tg !== u && tg.d.skill) tg.mana = Math.min(tg.manaMax, tg.mana + v); break;
      case 'execute':
        if (tg.hp / tg.maxHp <= v && tg.undying <= 0) { emit(B, { t: 'execute', uid: tg.uid }); dealDamage(B, u, tg, tg.hp + sum(tg.shields.map(s => s.amt)) + 1, 'true', { skill: true }); }
        break;
    }
  }
}

/* ===== 05-spells.js ===== */
/* =====================================================================
 * 05. 군주 주문 — 시전, 효과, 자동 시전 규칙, AI 시전
 *     플레이어 입력·자동 시전·AI 시전 모두 castSpell 하나로 처리된다.
 *     직접 입력은 B.queue 에 {side, slot, target} 이벤트로 들어가 다음 틱에 실행.
 * ===================================================================== */

function spellCostNow(S, slot) {
  let c = spellCost(slot.id, slot.lvl);
  if (S.lordType === 'tactic' && S.castCount === 0) c -= 2;
  if (S.aug.has('discount')) c = Math.max(Math.min(c, 1), c - 1);
  return Math.max(0, c);
}
function spellReady(S, i) {
  const sl = S.spells[i];
  if (!sl) return false;
  return !sl.used && sl.cd <= 0 && S.lm >= spellCostNow(S, sl);
}
function queueSpell(B, side, slot, target) { B.queue.push({ side, slot, target, tick: B.tick }); }

// target: {uid} | {uid, uid2} | {r} | {r, c} | {uid, r, c} | {}
function validTarget(B, S, sp, tg) {
  if (!tg) return false;
  const ally = id => { const u = unitByUid(B, id); return u && u.side === S.idx && targetable(u) ? u : null; };
  const foe = id => { const u = unitByUid(B, id); return u && u.side !== S.idx && targetable(u) ? u : null; };
  switch (sp.target) {
    case 'ally': return !!ally(tg.uid);
    case 'enemy': return !!foe(tg.uid);
    case 'none': return true;
    case 'row': return tg.r >= 0 && tg.r < GROWS;
    case 'cell': return tg.r >= 0 && tg.r < GROWS && tg.c >= 0 && tg.c < GCOLS;
    case 'ally2': return !!ally(tg.uid) && !!ally(tg.uid2) && tg.uid !== tg.uid2;
    case 'allyCell': return !!ally(tg.uid) && tg.r >= 0 && tg.r < GROWS && tg.c >= 0 && tg.c < GCOLS && !B.occ[tg.r][tg.c];
  }
  return false;
}

function castSpell(B, side, slotIdx, target, auto) {
  const S = B.sides[side];
  const sl = S.spells[slotIdx];
  if (!sl || B.over) return false;
  const sp = SPELLS[sl.id];
  if (!spellReady(S, slotIdx) || !validTarget(B, S, sp, target)) return false;
  S.lm -= spellCostNow(S, sl);
  S.castCount++;
  S.stats.casts++;
  if (sp.once) { sl.uses = (sl.uses || 0) + 1; if (sl.uses >= (S.aug.has('secondChance') ? 2 : 1)) sl.used = true; }
  else sl.cd = sp.cd * (S.aug.has('quickCast') ? 0.7 : 1);
  const mult = S.spellMult * (auto ? (S.ai && S.ai.mult ? S.ai.mult : CFG.AUTO_CAST_MULT) : 1);
  const v = sp.fx[0].v[sl.lvl - 1];
  emit(B, { t: 'spell', side, id: sl.id, name: sp.name, icon: sp.icon, lord: S.name, emoji: S.emoji, target, auto: !!auto });
  B.log.push({ tick: B.tick, side, slot: slotIdx, target, auto: !!auto });
  const enemyOf = id => unitByUid(B, id);
  const seal = u => (u && u.fx.has('seal') ? 1.3 : 1);
  const shieldDur = d => d + (S.lordType === 'guard' ? 1 : 0);
  const dmgMult = mult * S.spellDmgMult;
  const sideAllies = () => alliesOf(B, side);
  const area = (r, c) => enemiesOf(B, side).filter(e => cheb(e.r, e.c, r, c) <= 1);

  for (const fx of sp.fx) {
    const val = fx.v[sl.lvl - 1];
    switch (fx.t) {
      case 'dmg': { const e = enemyOf(target.uid); if (e) dealDamage(B, null, e, val * dmgMult, 'magic', { spellSide: side }); break; }
      case 'stun': { const e = enemyOf(target.uid); if (e) applyStun(B, e, val); break; }
      case 'shieldPct': {
        const a = unitByUid(B, target.uid);
        if (a) { const amt = a.maxHp * val * mult * seal(a); a.shields.push({ amt, t: shieldDur(fx.dur) }); S.stats.spellShield += amt; emit(B, { t: 'shield', uid: a.uid, a: amt }); }
        break;
      }
      case 'buffAll': for (const a of sideAllies()) addBuff(a, fx.stat, val * mult * seal(a), fx.dur); break;
      case 'buffPct': { const a = unitByUid(B, target.uid); if (a) addBuff(a, fx.stat, val * mult * seal(a), fx.dur); break; }
      case 'swap': {
        const a = unitByUid(B, target.uid), b = unitByUid(B, target.uid2);
        if (a && b) {
          const [ar, ac, br, bc] = [a.r, a.c, b.r, b.c];
          B.occ[ar][ac] = 0; B.occ[br][bc] = 0;
          a.r = br; a.c = bc; b.r = ar; b.c = ac; a.fr = a.r; a.fc = a.c; b.fr = b.r; b.fc = b.c;
          B.occ[a.r][a.c] = a.uid; B.occ[b.r][b.c] = b.uid;
          a.moveCd = 0; b.moveCd = 0; a.target = null; b.target = null;
          emit(B, { t: 'swap', a: a.uid, b: b.uid });
          if (val) { for (const x of [a, b]) { const amt = val * mult * seal(x); x.shields.push({ amt, t: shieldDur(3) }); S.stats.spellShield += amt; } }
        }
        break;
      }
      case 'fillMana': { const a = unitByUid(B, target.uid); if (a && a.d.skill) a.mana = a.manaMax; break; }
      case 'zone': B.zones.push({ side, row: target.r, dps: val * dmgMult, t: fx.dur }); break;
      case 'freezeAll': for (const e of enemiesOf(B, side)) { e.freeze = Math.max(e.freeze, val * mult); emit(B, { t: 'freeze', uid: e.uid }); } break;
      case 'undying': { const a = unitByUid(B, target.uid); if (a) { a.undying = val * mult * seal(a); emit(B, { t: 'undying', uid: a.uid }); } break; }
      case 'healAllPct': for (const a of sideAllies()) S.stats.spellHeal += healUnit(B, null, a, a.maxHp * val * mult * seal(a), true); break;
      case 'slowArea': for (const e of area(target.r, target.c)) { applySlow(B, e, Math.min(0.8, val * mult), fx.dur, true); applySlow(B, e, Math.min(0.8, val * mult), fx.dur, false); } break;
      case 'dmgArea': for (const e of area(target.r, target.c)) dealDamage(B, null, e, val * dmgMult, 'magic', { spellSide: side }); break;
      case 'teleport': {
        const a = unitByUid(B, target.uid);
        if (a && !B.occ[target.r][target.c]) {
          placeUnit(B, a, target.r, target.c, true); a.moveCd = 0; a.target = null;
          emit(B, { t: 'blink', uid: a.uid });
          if (val) { const amt = val * mult * seal(a); a.shields.push({ amt, t: shieldDur(3) }); S.stats.spellShield += amt; }
        }
        break;
      }
      case 'taunt': {
        const a = unitByUid(B, target.uid);
        if (a) { a.taunt = fx.dur; addBuff(a, 'armor', val * mult * seal(a), fx.dur); addBuff(a, 'mr', val * mult * seal(a), fx.dur); emit(B, { t: 'taunt', uid: a.uid }); }
        break;
      }
      case 'sunder': { const e = enemyOf(target.uid); if (e) { e.sunder = { amp: val * mult, t: fx.dur }; emit(B, { t: 'sunder', uid: e.uid }); } break; }
      case 'reap': {
        const e = enemyOf(target.uid);
        if (!e) break;
        if (e.hp / e.maxHp <= val * mult && e.undying <= 0) { emit(B, { t: 'execute', uid: e.uid }); dealDamage(B, null, e, e.hp + sum(e.shields.map(s => s.amt)) + 1, 'true', { spellSide: side }); }
        else dealDamage(B, null, e, 200 * dmgMult, 'magic', { spellSide: side });
        break;
      }
    }
  }
  if (S.aug.has('echo')) S.lm = Math.min(S.lmMax, S.lm + 1);
  if (S.aug.has('grace')) for (const id of [target.uid, target.uid2]) {
    const a = id != null ? unitByUid(B, id) : null;
    if (a && a.side === side && targetable(a)) S.stats.spellHeal += healUnit(B, null, a, a.maxHp * 0.15, true);
  }
  return true;
}

/* ---------- 자동 시전 규칙 ---------- */
function unitValue(u) { return u.d.cost * 3 + u.star * 4 + u.items.length * 3 + (u.monster ? 0 : 1); }
function bestBy(list, f) { let b = null, bv = -1e9; for (const x of list) { const v = f(x); if (v > bv) { bv = v; b = x; } } return b; }
function bestClump(B, side, min) {
  const foes = enemiesOf(B, side);
  let best = null, bn = 0;
  for (let r = 0; r < GROWS; r++) for (let c = 0; c < GCOLS; c++) {
    const n = foes.filter(e => cheb(e.r, e.c, r, c) <= 1).length;
    if (n > bn) { bn = n; best = { r, c }; }
  }
  return bn >= min ? best : null;
}
function safestCell(B, side) {
  const foes = enemiesOf(B, side);
  let best = null, bd = -1;
  for (let r = 0; r < GROWS; r++) for (let c = 0; c < GCOLS; c++) {
    if (B.occ[r][c]) continue;
    const d = foes.length ? Math.min(...foes.map(e => cheb(e.r, e.c, r, c))) : 0;
    if (d > bd) { bd = d; best = { r, c }; }
  }
  return best;
}

// 조건을 만족하면 대상을 돌려주고, 아니면 null
function ruleTarget(B, S, sl, rule, loose) {
  const sp = SPELLS[sl.id];
  const side = S.idx;
  const friends = alliesOf(B, side), foes = enemiesOf(B, side);
  if (!friends.length || !foes.length) return null;
  const ratio = u => u.hp / u.maxHp;
  const time = B.tick * CFG.TICK;
  const k = loose ? 1.4 : 1; // 느슨한 기준(즉시형 AI)
  const pick = u => (u ? { uid: u.uid } : null);
  switch (rule) {
    case 'off': return null;
    case 'asap': return defaultTarget(B, S, sp);
    case 'allyLow40': return pick(bestBy(friends.filter(u => ratio(u) <= 0.4 * k), u => u.items.length * 10 + unitValue(u)));
    case 'enemyMana80': return pick(bestBy(foes.filter(u => u.d.skill && u.mana / u.manaMax >= 0.8 / k), unitValue));
    case 'enemyCarry': return time >= 2 ? pick(bestBy(foes, unitValue)) : null;
    case 'enemyLowest': return pick(bestBy(foes, u => -u.hp));
    case 'midFight': return time >= 3 / k ? {} : null;
    case 'losing': return friends.length < foes.length ? {} : null;
    case 'swapTank': {
      const front = friends.filter(u => ratio(u) <= 0.35 * k && foes.some(e => cheb(e.r, e.c, u.r, u.c) <= 1));
      const a = bestBy(front, unitValue);
      if (!a) return null;
      const b = bestBy(friends.filter(u => u !== a && ratio(u) >= 0.7 && !foes.some(e => cheb(e.r, e.c, u.r, u.c) <= 1)), u => u.hp);
      return b ? { uid: a.uid, uid2: b.uid } : null;
    }
    case 'carryMana': return pick(bestBy(friends.filter(u => u.d.skill && u.mana / u.manaMax < 0.5 && !u.summon), unitValue));
    case 'rowMost': {
      let br = -1, bn = 0;
      for (let r = 0; r < GROWS; r++) { const n = foes.filter(e => e.r === r).length; if (n > bn) { bn = n; br = r; } }
      return bn >= (loose ? 2 : 3) ? { r: br } : null;
    }
    case 'enemySkills': return foes.filter(u => u.d.skill && u.mana / u.manaMax >= 0.7).length >= (loose ? 1 : 2) ? {} : null;
    case 'allyDying': return pick(bestBy(friends.filter(u => ratio(u) <= 0.25 * k && !u.summon), unitValue));
    case 'teamLow': return sum(friends.map(ratio)) / friends.length <= 0.6 * Math.min(k, 1.25) ? {} : null;
    case 'enemyClump': return bestClump(B, side, loose ? 2 : 3);
    case 'carryFight': return pick(bestBy(friends.filter(u => u.target && targetable(u.target) && cheb(u.r, u.c, u.target.r, u.target.c) <= u.range && !u.summon), unitValue));
    case 'rescueLow': {
      const a = bestBy(friends.filter(u => ratio(u) <= 0.35 * k && foes.some(e => cheb(e.r, e.c, u.r, u.c) <= 1)), unitValue);
      const cell = a && safestCell(B, side);
      return a && cell ? { uid: a.uid, r: cell.r, c: cell.c } : null;
    }
    case 'tankFront': {
      const pressed = friends.some(u => u.range >= 2 && foes.some(e => e.target === u && cheb(e.r, e.c, u.r, u.c) <= 1));
      return pressed ? pick(bestBy(friends.filter(u => u.range === 1 || u.traits.includes('guardian')), u => u.hp)) : null;
    }
    case 'enemyFront': return time >= 1.5 ? pick(bestBy(foes, u => u.maxHp)) : null;
    case 'enemyExecute': {
      const th = sp.fx[0].v[sl.lvl - 1];
      return pick(bestBy(foes.filter(u => u.hp / u.maxHp <= th && u.undying <= 0), unitValue));
    }
  }
  return null;
}

// '즉시' 규칙용 기본 대상
function defaultTarget(B, S, sp) {
  const side = S.idx;
  const friends = alliesOf(B, side), foes = enemiesOf(B, side);
  switch (sp.target) {
    case 'ally': return { uid: bestBy(friends, u => unitValue(u) - u.hp / u.maxHp * 5).uid };
    case 'enemy': return { uid: bestBy(foes, unitValue).uid };
    case 'none': return {};
    case 'row': { let br = 0, bn = -1; for (let r = 0; r < GROWS; r++) { const n = foes.filter(e => e.r === r).length; if (n > bn) { bn = n; br = r; } } return { r: br }; }
    case 'cell': return bestClump(B, side, 1);
    case 'ally2': return null;
    case 'allyCell': return null;
  }
  return null;
}

function autoCastTick(B, S, dt) {
  if (!S.spells.length) return;
  if (S.ai) return aiCastTick(B, S, dt);
  // 플레이어: 자동 시전이 켜진 주문(또는 즉시 결과 모드)만
  for (let i = 0; i < S.spells.length; i++) {
    const sl = S.spells[i];
    const rule = S.forceAuto && sl.rule === 'off' ? SPELLS[sl.id].auto[0] : sl.rule;
    if (rule === 'off' || !spellReady(S, i)) continue;
    const tg = ruleTarget(B, S, sl, rule, false);
    if (tg && castSpell(B, S.idx, i, tg, true)) return;
  }
}

// AI 군주 시전: 주문 성향이 높으면 비싼 주문을 위해 마나를 아끼고, 낮으면 싼 주문을 바로 쓴다.
function aiCastTick(B, S, dt) {
  const tend = S.ai.tend;
  if (S.aiWait > 0) { S.aiWait -= dt; return; }
  const idxs = S.spells.map((_, i) => i).sort((a, b) =>
    tend >= 0.5 ? spellCostNow(S, S.spells[b]) - spellCostNow(S, S.spells[a]) : spellCostNow(S, S.spells[a]) - spellCostNow(S, S.spells[b]));
  const top = S.spells[idxs[0]];
  for (const i of idxs) {
    const sl = S.spells[i];
    if (!spellReady(S, i)) continue;
    // 절약형: 가장 비싼 주문이 아직 안 됐으면, 마나가 남을 때만 싼 주문 사용
    if (tend >= 0.45 && sl !== top && !top.used && top.cd <= 0 && S.lm - spellCostNow(S, sl) < spellCostNow(S, top)) continue;
    const loose = tend < 0.4;
    let tg = ruleTarget(B, S, sl, SPELLS[sl.id].auto[0], loose);
    if (!tg && SPELLS[sl.id].auto[1]) tg = ruleTarget(B, S, sl, SPELLS[sl.id].auto[1], loose);
    // 마나가 가득 차면 낭비하지 않도록 기본 대상에게라도 시전
    if (!tg && (S.lm >= S.lmMax - 0.5 || (loose && B.tick * CFG.TICK > 4))) tg = ruleTarget(B, S, sl, 'asap', true);
    if (!tg) continue;
    if (S.ai.castDelay > 0 && !S.aiArmed) { S.aiArmed = true; S.aiWait = B.rng.next() * S.ai.castDelay; return; }
    S.aiArmed = false;
    if (castSpell(B, S.idx, i, tg, true)) return;
  }
}

/* ===== 06-game.js ===== */
/* =====================================================================
 * 06. 게임 상태 — 공유 유닛 풀, 상점, 경제, 합성, 아이템, 주문, 라운드
 *     모든 상태는 G 하나에 모여 있고 JSON으로 그대로 저장된다.
 * ===================================================================== */

let G = null;
const SAVE_KEY = 'sevenLordsTable.save.v1';

function newGame(opts) {
  const seed = opts.seed >>> 0 || ((Math.random() * 2 ** 31) | 0);
  const rng = new RNG(seed);
  G = {
    seed, rngS: 0, difficulty: opts.difficulty || 'normal',
    stage: 1, round: 1, phase: 'prep', uidN: 1, pool: {}, players: [],
    roundsPlayed: 0, log: [], lastOpp: {}, pendingSpellPick: false,
    battleSpeed: 1, instant: false, over: false,
  };
  for (const id in UNITS) G.pool[id] = POOL_SIZE[UNITS[id].cost];
  // 플레이어
  G.players.push(makePlayer(0, '나', '🧑‍✈️', opts.lordType, true));
  // AI 군주 12명 중 7명 무작위, 성향 수치에 소폭 변동
  const roster = rng.shuffle(LORD_ROSTER.slice()).slice(0, 7);
  roster.forEach((L, i) => {
    const P = makePlayer(i + 1, L.name, L.emoji, L.type, false);
    const p = {};
    for (const k in L.p) p[k] = clamp(L.p[k] + rng.range(-0.12, 0.12), 0, 1);
    P.ai = { p, fav: L.fav.slice(), focus: L.fav.slice(), style: L.style, rerollLevel: rng.pick([4, 5, 6]) };
    G.players.push(P);
  });
  G.rngS = rng.s;
  // 시작 유닛 1개씩
  for (const P of G.players) {
    const ids = Object.keys(UNITS).filter(id => UNITS[id].cost === 1);
    const id = R().pick(ids);
    takeFromPool(id, 1);
    P.bench[0] = makeUnit(id, 1);
  }
  return G;
}

// 게임 난수: 상태를 G에 보관해 저장·재현 가능
function R() {
  const r = new RNG(G.rngS || G.seed);
  return {
    next() { const v = r.next(); G.rngS = r.s; return v; },
    int(n) { return Math.floor(this.next() * n); },
    range(a, b) { return a + this.next() * (b - a); },
    chance(p) { return this.next() < p; },
    pick(a) { return a[this.int(a.length)]; },
    shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = this.int(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; },
    weighted(w) { let s = sum(w), x = this.next() * s; for (let i = 0; i < w.length; i++) { x -= w[i]; if (x < 0) return i; } return w.length - 1; },
  };
}

function makePlayer(id, name, emoji, lordType, isHuman) {
  return {
    id, name, emoji, lordType, isHuman, hp: CFG.START_HP, gold: 0, level: 1, xp: 0,
    board: [], bench: new Array(CFG.BENCH).fill(null), shop: [null, null, null, null, null],
    items: [], spells: LORD_TYPES[lordType].spells.map(s => ({ id: s, lvl: 1, rule: 'off' })),
    equipped: [0, 1], aug: [], streak: 0, alive: true, place: 0, freeRolls: 0, eggT: 0,
    lastResult: null, ai: null, history: [],
  };
}
function makeUnit(defId, star) { return { uid: G.uidN++, defId, star, items: [] }; }
const human = () => G.players[0];
const hasAug = (P, id) => P.aug.some(a => a.id === id);
function boardLimit(P) { return P.level + (hasAug(P, 'bigBoard') ? 1 : 0); }
function spellSlots(P) { return 2 + (P.level >= 7 ? 1 : 0) + (hasAug(P, 'spellSlot') ? 1 : 0); }
function xpCost(P) { return CFG.XP_COST + (hasAug(P, 'spellSlot') ? 1 : 0) - (hasAug(P, 'cheapXp') ? 1 : 0); }
function rerollCost(P) { return P.freeRolls > 0 ? 0 : hasAug(P, 'cheapRoll') ? 1 : CFG.REROLL_COST; }
function spellUpCost(P, s) { return Math.max(1, SPELLS[s.id].up[s.lvl - 1] - (hasAug(P, 'apprentice') ? 2 : 0)); }
function allUnits(P) { return [...P.board, ...P.bench.filter(Boolean)]; }
function stageBaseDamage(stage) { return [0, 0, 2, 3, 5, 8, 10, 12, 15, 18][Math.min(stage, 9)]; }

/* ---------- 유닛 풀 ---------- */
function takeFromPool(id, n) { G.pool[id] = Math.max(0, (G.pool[id] || 0) - n); }
function returnToPool(u) { if (UNITS[u.defId]) G.pool[u.defId] += 3 ** (u.star - 1); }

function rollShop(P) {
  const odds = SHOP_ODDS[P.level].slice();
  if (hasAug(P, 'highRoller')) { odds[1] += odds[0]; odds[0] = 0; }
  const r = R();
  for (let i = 0; i < 5; i++) {
    let id = null;
    for (let tries = 0; tries < 6 && !id; tries++) {
      const cost = r.weighted(odds) + 1;
      const ids = Object.keys(UNITS).filter(k => UNITS[k].cost === cost && G.pool[k] > 0);
      if (!ids.length) continue;
      id = ids[r.weighted(ids.map(k => G.pool[k]))];
    }
    P.shop[i] = id;
  }
}

/* ---------- 구매·판매·합성 ---------- */
function benchFree(P) { return P.bench.indexOf(null); }
function copiesOf(P, defId, star = 1) { return allUnits(P).filter(u => u.defId === defId && u.star === star).length; }

function buyUnit(P, slot) {
  const id = P.shop[slot];
  if (!id) return false;
  const cost = UNITS[id].cost;
  if (P.gold < cost || G.pool[id] <= 0) return false;
  const free = benchFree(P);
  if (free < 0 && copiesOf(P, id) < 2) return false;
  P.gold -= cost;
  takeFromPool(id, 1);
  P.shop[slot] = null;
  const u = makeUnit(id, 1);
  if (free >= 0) P.bench[free] = u;
  else P.bench.push(u); // 즉시 합성되어 사라질 임시 칸
  checkMerge(P);
  const extra = P.bench.slice(CFG.BENCH).filter(Boolean);
  P.bench = P.bench.slice(0, CFG.BENCH);
  for (const x of extra) { const f = benchFree(P); if (f >= 0) P.bench[f] = x; }
  return true;
}

function checkMerge(P) {
  for (let star = 1; star <= 2; star++) {
    let merged = true;
    while (merged) {
      merged = false;
      const groups = {};
      for (const u of allUnits(P)) if (u.star === star) (groups[u.defId] = groups[u.defId] || []).push(u);
      for (const id in groups) {
        const g = groups[id];
        if (g.length < 3) continue;
        // 보드 위의 유닛을 우선 남긴다
        g.sort((a, b) => (P.board.includes(b) ? 1 : 0) - (P.board.includes(a) ? 1 : 0));
        const keep = g[0], gone = g.slice(1, 3);
        const items = [...keep.items];
        for (const x of gone) {
          items.push(...x.items);
          removeUnit(P, x);
        }
        keep.star = star + 1;
        keep.items = [];
        for (const it of items) if (!equipItem(keep, it)) P.items.push(it);
        if (P.isHuman) toast(`${UNITS[id].emoji} ${UNITS[id].name} ${'★'.repeat(keep.star)} 합성!`, 'gold');
        merged = true;
        break;
      }
    }
  }
}
function removeUnit(P, u) {
  const bi = P.board.indexOf(u);
  if (bi >= 0) P.board.splice(bi, 1);
  const ci = P.bench.indexOf(u);
  if (ci >= 0) P.bench[ci] = null;
}
function sellPrice(u) { const c = UNITS[u.defId].cost; return u.star === 1 ? c : c * 3 ** (u.star - 1) - (c > 1 ? 1 : 0); }
function sellUnit(P, u) {
  removeUnit(P, u);
  P.gold += sellPrice(u) + (hasAug(P, 'broker') ? 1 : 0);
  P.items.push(...u.items);
  returnToPool(u);
}

function buyXp(P) {
  if (P.level >= 9 || P.gold < xpCost(P)) return false;
  P.gold -= xpCost(P);
  addXp(P, CFG.XP_AMOUNT);
  return true;
}
function addXp(P, n) {
  P.xp += n;
  while (P.level < 9 && P.xp >= XP_TABLE[P.level]) {
    P.xp -= XP_TABLE[P.level];
    P.level++;
    if (P.isHuman) toast(`레벨 ${P.level}! 보드 유닛 ${boardLimit(P)}명`, 'gold');
  }
  if (P.level >= 9) P.xp = 0;
}
function reroll(P) {
  const c = rerollCost(P);
  if (P.gold < c) return false;
  P.gold -= c;
  if (c === 0) P.freeRolls--;
  rollShop(P);
  return true;
}

/* ---------- 아이템 ---------- */
// 재료가 이미 있으면 합쳐서 완성 아이템이 된다. 유닛당 최대 3개.
function equipItem(u, it) {
  if (COMPONENTS[it]) {
    const ci = u.items.findIndex(x => COMPONENTS[x]);
    if (ci >= 0) { u.items[ci] = itemKey(u.items[ci], it); return true; }
  }
  if (u.items.length >= CFG.ITEM_MAX) return false;
  u.items.push(it);
  return true;
}

/* ---------- 주문 ---------- */
function equippedSpells(P) {
  return P.equipped.slice(0, spellSlots(P)).map(i => P.spells[i]).filter(Boolean);
}
function toggleEquip(P, idx) {
  const pos = P.equipped.indexOf(idx);
  if (pos >= 0) { P.equipped.splice(pos, 1); return true; }
  if (P.equipped.length >= spellSlots(P)) return false;
  if (SPELLS[P.spells[idx].id].once && P.equipped.some(i => SPELLS[P.spells[i].id].once)) {
    if (P.isHuman) toast('전투당 1회 주문은 1장만 가져갈 수 있습니다', 'bad');
    return false;
  }
  P.equipped.push(idx);
  return true;
}
function upgradeSpell(P, idx) {
  const s = P.spells[idx];
  if (!s || s.lvl >= 3) return false;
  const cost = spellUpCost(P, s);
  if (P.gold < cost) return false;
  P.gold -= cost;
  s.lvl++;
  return true;
}
function addSpell(P, id) {
  if (P.spells.some(s => s.id === id)) return false;
  P.spells.push({ id, lvl: 1, rule: 'off' });
  const idx = P.spells.length - 1;
  if (P.equipped.length < spellSlots(P)) toggleEquip(P, idx);
  return true;
}
function spellOffers(P, n) {
  const pool = SPELL_KEYS.filter(id => !P.spells.some(s => s.id === id));
  return R().shuffle(pool).slice(0, n);
}

/* ---------- 증강 ---------- */
function augmentOffers(P) {
  const r = R();
  const keys = r.shuffle(AUG_KEYS.filter(k => !hasAug(P, k) || k === 'emblem')).slice(0, 3);
  return keys.map(id => {
    const o = { id };
    if (AUGMENTS[id].param === 'trait') {
      const counts = computeTraits(allUnits(P), []);
      const owned = TRAIT_KEYS.filter(t => counts[t]);
      o.param = owned.length ? r.pick(owned) : r.pick(TRAIT_KEYS);
    }
    return o;
  });
}
function augName(a) { return AUGMENTS[a.id].name + (a.param ? ` (${TRAITS[a.param].name})` : ''); }
function augDesc(a) { return AUGMENTS[a.id].desc.replace('{trait}', a.param ? TRAITS[a.param].name : ''); }
function applyAugment(P, a) {
  P.aug.push(a);
  const r = R();
  switch (a.id) {
    case 'loot': for (let i = 0; i < 2; i++) P.items.push(r.pick(COMP_KEYS)); break;
    case 'cash': P.gold += 15; break;
    case 'heartyHP': P.hp += 20; break;
    case 'spellHone': for (const s of P.spells) s.lvl = Math.min(3, s.lvl + 1); break;
    case 'library': for (const id of spellOffers(P, 2)) addSpell(P, id); break;
    case 'hire': for (let i = 0; i < 2; i++) grantRandomUnit(P, 3, 1); break;
    case 'treasure': P.gold += 30; P.hp -= 10; break;
    case 'goldenEgg': P.eggT = 4; break;
    case 'xpBoost': if (P.level < 9) addXp(P, XP_TABLE[P.level] - P.xp); break;
    case 'itemSmith': P.items.push(itemKey(r.pick(COMP_KEYS), r.pick(COMP_KEYS))); break;
    case 'tripleContract': {
      const ids = Object.keys(UNITS).filter(k => UNITS[k].cost === 1 && G.pool[k] >= 3);
      if (ids.length) { const id = r.pick(ids); takeFromPool(id, 3); placeNewUnit(P, makeUnit(id, 2)); }
      break;
    }
    case 'legendCall': grantRandomUnit(P, 4, 1); break;
    case 'freeSpell':
      if (P.isHuman) G.pendingSpellPick = true;
      else { const ids = spellOffers(P, 3); if (ids.length) addSpell(P, aiPickSpell(P, ids)); }
      break;
  }
}
// 대기석에 빈 칸이 없으면 유닛을 풀로 돌려보내고 그 가치를 골드로 준다
function placeNewUnit(P, u) {
  const f = benchFree(P);
  if (f >= 0) { P.bench[f] = u; checkMerge(P); return true; }
  returnToPool(u);
  P.gold += sellPrice(u);
  return false;
}
function grantRandomUnit(P, cost, star) {
  const ids = Object.keys(UNITS).filter(k => UNITS[k].cost === cost && G.pool[k] > 0);
  if (!ids.length) return;
  const id = R().pick(ids);
  takeFromPool(id, 1);
  placeNewUnit(P, makeUnit(id, star));
}

/* ---------- 라운드 구성 ---------- */
// 1단계: 몬스터 3라운드. 2단계부터: 대전, 대전, 대전, 공용 선택, 대전, 대전, 몬스터
function roundType(stage, round) {
  if (stage === 1) return 'pve';
  return ['pvp', 'pvp', 'pvp', 'carousel', 'pvp', 'pvp', 'pve'][round - 1];
}
function roundsInStage(stage) { return stage === 1 ? 3 : 7; }
function roundLabel() { return `${G.stage}-${G.round}`; }
function advanceRound() {
  G.round++;
  if (G.round > roundsInStage(G.stage)) { G.stage++; G.round = 1; }
  G.roundsPlayed++;
}
function augmentDue() { return G.round === 1 && G.stage >= 2 && G.stage <= 4; }

function interest(P) { return Math.min(Math.floor(P.gold / 10), hasAug(P, 'bigInterest') ? 7 : CFG.MAX_INTEREST); }
function streakBonus(P) {
  const s = Math.abs(P.streak);
  const b = s >= 6 ? 3 : s >= 4 ? 2 : s >= 2 ? 1 : 0;
  return b ? b + (hasAug(P, 'streakPlus') ? 1 : 0) : 0;
}
// 준비 단계 시작: 수입, 경험치, 상점
function startPrep() {
  for (const P of G.players) {
    if (!P.alive) continue;
    const inc = CFG.BASE_INCOME + interest(P) + streakBonus(P) + (hasAug(P, 'income') ? 1 : 0)
      + (hasAug(P, 'patience') && P.streak < 0 ? 2 : 0);
    P.gold += inc;
    P.lastIncome = inc;
    if (G.roundsPlayed > 0) addXp(P, 2 + (hasAug(P, 'scholar') ? 2 : 0));
    P.freeRolls = (hasAug(P, 'freeRoll') ? 1 : 0) + (hasAug(P, 'rerollMaster') ? 2 : 0);
    if (P.eggT > 0 && --P.eggT === 0) { P.gold += 35; if (P.isHuman) toast('🥚 황금알 부화! +35골드', 'gold'); }
    if (hasAug(P, 'supply') && G.roundsPlayed % 2 === 0) P.items.push(R().pick(COMP_KEYS));
    rollShop(P);
  }
}

/* ---------- 전투 명세 ---------- */
function specOf(P, opts = {}) {
  const diff = DIFFICULTY[G.difficulty];
  return {
    name: P.name, emoji: P.emoji, isPlayer: P.isHuman,
    units: P.board.map(u => ({ defId: u.defId, star: u.star, items: u.items, r: u.r, c: u.c })),
    traits: computeTraits(P.board, P.aug), aug: P.aug, lordType: P.lordType,
    spells: equippedSpells(P).map(s => ({ id: s.id, lvl: s.lvl, rule: s.rule })),
    ai: P.isHuman ? null : { tend: P.ai.p.spell, castDelay: diff.castDelay, mult: G.difficulty === 'hard' ? 1 : CFG.AUTO_CAST_MULT },
    forceAuto: !!opts.forceAuto,
  };
}
function monsterSpec() {
  const key = G.stage === 1 ? G.round : 's' + Math.min(G.stage, 6);
  const scale = G.stage <= 2 ? 1 : 1 + (G.stage - 2) * 0.18;
  return {
    name: '중립 몬스터', emoji: '👾', isPlayer: false, units: MONSTER_WAVES[key].map(([defId, r, c]) => ({ defId, star: 1, items: [], r, c })),
    traits: {}, aug: [], lordType: null, spells: [], ai: null, monsterScale: scale,
  };
}

/* ---------- 매칭 ---------- */
function makePairs() {
  const alive = G.players.filter(P => P.alive);
  const r = R();
  let best = null;
  for (let t = 0; t < 12; t++) {
    const arr = r.shuffle(alive.slice());
    const pairs = [];
    for (let i = 0; i + 1 < arr.length; i += 2) pairs.push([arr[i], arr[i + 1]]);
    const repeats = pairs.filter(([a, b]) => G.lastOpp[a.id] === b.id).length;
    const odd = arr.length % 2 ? arr[arr.length - 1] : null;
    if (!best || repeats < best.repeats) best = { pairs, odd, repeats };
    if (!repeats) break;
  }
  // 홀수면 마지막 군주는 다른 군주의 '유령 복제'와 싸운다 (복제 쪽은 피해 없음)
  if (best.odd) {
    const ghost = r.pick(alive.filter(P => P !== best.odd));
    best.pairs.push([best.odd, ghost, true]);
  }
  for (const [a, b, g] of best.pairs) { G.lastOpp[a.id] = b.id; if (!g) G.lastOpp[b.id] = a.id; }
  return best.pairs;
}

/* ---------- 전투 결과 적용 ---------- */
function survivorDamage(list) { return sum(list.map(s => s.star + (s.cost >= 4 ? 1 : 0))); }
function applyResult(P, won, dmg, pvp, oppName) {
  if (won) {
    if (pvp) P.streak = P.streak > 0 ? P.streak + 1 : 1;
    if (pvp && hasAug(P, 'victoryGold')) P.gold += 2;
  } else {
    if (pvp) P.streak = P.streak < 0 ? P.streak - 1 : -1;
    if (hasAug(P, 'ironWill')) dmg = Math.max(1, Math.round(dmg * 0.75));
    P.hp -= dmg;
  }
  P.lastResult = { won, dmg: won ? 0 : dmg, opp: oppName };
  P.history.push(won ? 'W' : 'L');
}
function processEliminations() {
  const dead = G.players.filter(P => P.alive && P.hp <= 0).sort((a, b) => a.hp - b.hp);
  const out = [];
  for (const P of dead) {
    const aliveCount = G.players.filter(x => x.alive).length;
    P.alive = false;
    P.place = aliveCount;
    for (const u of allUnits(P)) returnToPool(u);
    P.board = []; P.bench = new Array(CFG.BENCH).fill(null);
    out.push(P);
  }
  const alive = G.players.filter(P => P.alive);
  if (alive.length === 1) alive[0].place = 1;
  return out;
}

/* ---------- 저장 ---------- */
function saveGame() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(G)); } catch (e) { /* 저장 불가 환경 */ }
}
function loadGame() {
  try {
    const s = localStorage.getItem(SAVE_KEY);
    if (!s) return null;
    return JSON.parse(s);
  } catch (e) { return null; }
}
function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* 무시 */ } }

/* ===== 07-ai.js ===== */
/* =====================================================================
 * 07. AI 군주 — 성향 파라미터(경제·레벨·집착·리롤·주문)에 따른 준비 단계
 * ===================================================================== */

function desiredLevel(P) {
  const p = P.ai.p;
  const base = [0, 3, 5, 6, 7, 8, 9, 9, 9][Math.min(G.stage, 8)];
  let d = base + (p.level > 0.7 ? 1 : 0) - (p.level < 0.3 ? 1 : 0);
  if (p.reroll > 0.7 && G.stage < 5) d = Math.min(d, P.ai.rerollLevel);
  if (G.stage === 2 && G.round <= 2) d = Math.min(d, 4);
  return clamp(d, 1, 9);
}

function aiReserve(P) {
  const p = P.ai.p;
  if (G.stage <= 1) return 0;
  let reserve = Math.round(p.econ * (G.stage === 2 ? 30 : 50));
  if (P.hp <= 40) reserve = Math.min(reserve, 20);
  if (P.hp <= 25) reserve = 0;
  return reserve;
}

function aiUnitScore(P, id) {
  const d = UNITS[id];
  const diff = DIFFICULTY[G.difficulty];
  const counts = computeTraits(P.board, P.aug);
