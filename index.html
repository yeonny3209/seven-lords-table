  const c1 = copiesOf(P, id, 1), c2 = copiesOf(P, id, 2);
  let s = c1 * 3 + (c1 === 2 ? 4 : 0) + c2 * 2;
  for (const t of d.traits) {
    if (P.ai.focus.includes(t)) s += 2.5 + 3 * P.ai.p.commit;
    if (counts[t]) s += 1;
  }
  s += d.cost * (0.6 + 0.25 * G.stage);
  if (P.ai.p.reroll > 0.6 && d.cost <= 2) s += 2;
  s += (R().next() - 0.5) * diff.noise * 8;
  return s;
}

function unitPower(u) {
  return UNITS[u.defId].cost * [0, 1, 2.6, 6][u.star] * 3 + u.items.length * 2.5;
}

function aiSellWorst(P, againstScore) {
  let worst = null, wv = 1e9;
  for (const u of P.bench) if (u) { const v = unitPower(u) + copiesOf(P, u.defId, u.star) * 2; if (v < wv) { wv = v; worst = u; } }
  if (worst && wv < againstScore) { sellUnit(P, worst); return true; }
  return false;
}

function aiBuyFromShop(P, reserve) {
  const total = allUnits(P).length;
  const threshold = total < boardLimit(P) + 2 ? -99 : 5 + G.stage * 0.8;
  const order = P.shop.map((id, i) => ({ id, i, s: id ? aiUnitScore(P, id) : -99 })).sort((a, b) => b.s - a.s);
  for (const o of order) {
    if (!o.id || o.s < threshold) continue;
    const cost = UNITS[o.id].cost;
    const merges = copiesOf(P, o.id) >= 2;
    if (P.gold < cost || (P.gold - cost < reserve && !merges)) continue;
    if (benchFree(P) < 0 && !merges && !aiSellWorst(P, o.s)) continue;
    buyUnit(P, o.i);
  }
}

function aiPrep(P) {
  const p = P.ai.p, r = R();
  // 집착도가 낮으면 가진 유닛에 맞춰 방향을 바꾼다
  if (G.stage >= 3 && r.chance((1 - p.commit) * 0.35)) {
    const counts = computeTraits(allUnits(P), P.aug);
    const top = TRAIT_KEYS.filter(t => counts[t]).sort((a, b) => counts[b] - counts[a]).slice(0, 2);
    if (top.length === 2) P.ai.focus = top;
  }
  const reserve = aiReserve(P);
  // 주문 강화
  if (G.stage >= 2) for (const i of P.equipped) {
    const s = P.spells[i];
    if (!s || s.lvl >= 3) continue;
    const c = spellUpCost(P, s);
    if (P.gold - c >= reserve && r.chance(p.spell * 0.6)) upgradeSpell(P, i);
  }
  // 레벨
  const want = desiredLevel(P);
  while (P.level < want && P.gold - xpCost(P) >= reserve) buyXp(P);
  // 구매
  aiBuyFromShop(P, reserve);
  // 리롤
  const rerollMode = p.reroll > 0.6 && P.level >= P.ai.rerollLevel && G.stage >= 3;
  const desperate = P.hp <= 30 && G.stage >= 3;
  const rich = P.level >= 8 && P.gold > 55;
  const floor = desperate ? 0 : rerollMode ? 12 : 50;
  let guard = 0;
  while ((rerollMode || desperate || rich) && P.gold - rerollCost(P) >= floor && guard++ < 25) {
    reroll(P);
    aiBuyFromShop(P, floor);
  }
  aiArrange(P);
  aiItems(P);
  aiSpells(P);
}

/* ---------- 배치 ---------- */
function aiArrange(P) {
  const diff = DIFFICULTY[G.difficulty], r = R();
  const units = allUnits(P);
  const limit = boardLimit(P);
  const chosen = [], seen = new Set(), counts = {};
  const pool = units.slice();
  while (chosen.length < limit && pool.length) {
    let bi = 0, bv = -1e9;
    pool.forEach((u, i) => {
      let v = unitPower(u);
      if (!seen.has(u.defId)) for (const t of UNITS[u.defId].traits) {
        const n = (counts[t] || 0) + 1;
        if (TRAITS[t].tiers.includes(n)) v += 6 * (TRAITS[t].tiers.indexOf(n) + 1);
        else v += P.ai.focus.includes(t) ? 1.5 : 0.5;
      }
      if (v > bv) { bv = v; bi = i; }
    });
    const u = pool.splice(bi, 1)[0];
    if (!seen.has(u.defId)) { seen.add(u.defId); for (const t of UNITS[u.defId].traits) counts[t] = (counts[t] || 0) + 1; }
    chosen.push(u);
  }
  // 보드 ↔ 대기석 재배치
  P.board = [];
  P.bench = new Array(CFG.BENCH).fill(null);
  pool.slice(0, CFG.BENCH).forEach((u, i) => { P.bench[i] = u; });
  for (const u of pool.slice(CFG.BENCH)) sellUnit(P, u);
  placeFormation(P, chosen);
  // 쉬움: 배치 실수
  for (const u of P.board) if (r.chance(diff.misplace)) {
    const free = [];
    for (let rr = 0; rr < CFG.ROWS; rr++) for (let cc = 0; cc < CFG.COLS; cc++) if (!P.board.some(x => x.r === rr && x.c === cc)) free.push([rr, cc]);
    if (free.length) [u.r, u.c] = r.pick(free);
  }
}

function placeFormation(P, list) {
  const taken = new Set();
  const put = (u, cells) => {
    for (const [r, c] of cells) if (!taken.has(r * 10 + c)) { taken.add(r * 10 + c); u.r = r; u.c = c; P.board.push(u); return; }
  };
  const frontCells = [3, 2, 4, 1, 5, 0, 6].map(c => [0, c]).concat([3, 2, 4, 1, 5, 0, 6].map(c => [1, c]));
  const flankCells = [[1, 0], [1, 6], [0, 0], [0, 6], [1, 1], [1, 5], [2, 0], [2, 6]];
  const backCells = [0, 6, 1, 5, 2, 4, 3].map(c => [3, c]).concat([0, 6, 1, 5, 2, 4, 3].map(c => [2, c]));
  const all = [...frontCells, ...backCells];
  // 어려움: 플레이어가 돌격대로 뒷줄을 노리면 수호자 하나를 뒷줄에 세운다
  const H = G ? human() : null;
  const counter = H && DIFFICULTY[G.difficulty].counter && H.alive && traitTier('vanguard', computeTraits(H.board, H.aug).vanguard || 0) >= 1;
  const role = u => UNITS[u.defId].roles[0];
  const sorted = list.slice().sort((a, b) => unitPower(b) - unitPower(a));
  let backGuard = counter ? sorted.filter(u => role(u) === 'guardian')[1] : null;
  for (const u of sorted) {
    const ro = role(u);
    if (u === backGuard) put(u, [[3, 3], [3, 2], [3, 4], ...all]);
    else if (ro === 'guardian' || ro === 'vanguard') put(u, [...frontCells, ...all]);
    else if (ro === 'assassin') put(u, [...flankCells, ...all]);
    else put(u, [...backCells, ...all]);
  }
}

/* ---------- 아이템: 핵심 딜러에게 몰아준다 ---------- */
const CARRY_COMPS = ['sword', 'bow', 'rod', 'glove', 'tear'];
function aiItems(P) {
  if (!P.items.length || !P.board.length) return;
  const isTankRole = u => ['guardian', 'vanguard'].includes(UNITS[u.defId].roles[0]);
  const carry = P.board.filter(u => !isTankRole(u)).sort((a, b) => unitPower(b) - unitPower(a))[0] || P.board[0];
  const tank = P.board.filter(isTankRole).sort((a, b) => unitPower(b) - unitPower(a))[0] || carry;
  const keep = [];
  // 완성 아이템
  for (const it of P.items.filter(x => !COMPONENTS[x])) {
    const st = itemInfo(it).stats;
    const tanky = (st.armor || 0) + (st.mr || 0) + (st.hp || 0) / 6 > (st.atk || 0) + (st.ap || 0) + (st.as || 0) * 100 + (st.crit || 0) * 100;
    const target = tanky ? tank : carry;
    if (!equipItem(target, it) && !equipItem(tanky ? carry : tank, it)) keep.push(it);
  }
  // 재료: 두 개씩 묶어서 장착
  let comps = P.items.filter(x => COMPONENTS[x]);
  comps.sort((a, b) => CARRY_COMPS.includes(b) - CARRY_COMPS.includes(a));
  while (comps.length >= 2 || (comps.length === 1 && G.stage >= 4)) {
    const a = comps.shift();
    const forCarry = CARRY_COMPS.includes(a);
    const target = [forCarry ? carry : tank, forCarry ? tank : carry].find(u => u.items.length < CFG.ITEM_MAX || u.items.some(x => COMPONENTS[x]));
    if (!target) { keep.push(a, ...comps); comps = []; break; }
    equipItem(target, a);
    if (comps.length) {
      const prefIdx = comps.findIndex(x => CARRY_COMPS.includes(x) === forCarry);
      const b = comps.splice(prefIdx >= 0 ? prefIdx : 0, 1)[0];
      if (!equipItem(target, b)) keep.push(b);
    }
  }
  P.items = keep.concat(comps);
}

/* ---------- 주문 선택 ---------- */
function aiSpellScore(P, s) {
  const sp = SPELLS[s.id];
  const pref = { war: 'atk', guard: 'def', tactic: 'ctl' }[P.lordType];
  let v = s.lvl * 2 + (sp.kind === pref ? 2 : 0) + sp.cost * P.ai.p.spell * 0.4;
  if (DIFFICULTY[G.difficulty].counter) {
    const H = computeTraits(human().board, human().aug);
    const dive = (H.assassin || 0) + (H.vanguard || 0), ranged = (H.sniper || 0) + (H.mystic || 0);
    if (dive >= 3 && ['taunt', 'shield', 'resolve', 'swap'].includes(s.id)) v += 3;
    if (ranged >= 3 && ['bolt', 'sunder', 'timestop', 'reap'].includes(s.id)) v += 3;
  }
  return v;
}
function aiSpells(P) {
  const order = P.spells.map((s, i) => ({ i, v: aiSpellScore(P, s) })).sort((a, b) => b.v - a.v);
  P.equipped = [];
  for (const o of order) { if (P.equipped.length >= spellSlots(P)) break; toggleEquip(P, o.i); }
}

/* ---------- 공용 선택 · 증강 · 주문 보상 ---------- */
function aiCarouselPick(P, options) {
  let bi = 0, bv = -1e9;
  options.forEach((o, i) => {
    if (o.taken) return;
    const v = o.kind === 'unit' ? aiUnitScore(P, o.defId) + 3 : (P.spells.some(s => s.id === o.id) ? -50 : 3 + P.ai.p.spell * 9);
    if (v > bv) { bv = v; bi = i; }
  });
  return bi;
}
function aiPickAugment(P, offers) {
  const p = P.ai.p, r = R();
  const w = offers.map(a => {
    if (AUGMENTS[a.id].spell) return 1 + p.spell * 3;
    if (AUGMENTS[a.id].econ || ['income', 'bigInterest', 'cash'].includes(a.id)) return 1 + p.econ * 3;
    if (AUGMENTS[a.id].reroll) return 1 + p.reroll * 3;
    if (a.id === 'emblem') return 1 + p.commit * 2;
    return 1.6;
  });
  return offers[r.weighted(w)];
}
function aiPickSpell(P, ids) {
  return ids.slice().sort((a, b) => aiSpellScore(P, { id: b, lvl: 1 }) - aiSpellScore(P, { id: a, lvl: 1 }))[0];
}

/* ===== 08-render.js ===== */
/* =====================================================================
 * 08. 화면 그리기 — 캔버스 보드, 유닛, 체력·마나바, 공격 이펙트, 피해 숫자
 * ===================================================================== */

const VIEW = { CELL: 64, W: 448, BOARD_H: 512, GAP: 14, BENCH_H: 58 };
VIEW.H = VIEW.BOARD_H + VIEW.GAP + VIEW.BENCH_H;
VIEW.BENCH_Y = VIEW.BOARD_H + VIEW.GAP;
VIEW.BENCH_W = VIEW.W / CFG.BENCH;

const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
let DPR = 1;
function resizeCanvas() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = VIEW.W * DPR; canvas.height = VIEW.H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

// 전투 연출 상태
const FX = { floats: [], projs: [], flashes: [], texts: [], shake: 0 };
const UI = {
  hover: null,          // {kind:'board'|'bench', r, c, i}
  drag: null,           // {unit, from, x, y} 또는 {item, idx}
  aim: null,            // {slot, step, first}
  aimHover: null,
  battle: null,         // 진행 중인 전투 B
  battleView: false,
  lastFrame: 0, acc: 0,
};

function cellCenter(r, c) { return [c * VIEW.CELL + VIEW.CELL / 2, r * VIEW.CELL + VIEW.CELL / 2]; }
function benchCenter(i) { return [i * VIEW.BENCH_W + VIEW.BENCH_W / 2, VIEW.BENCH_Y + VIEW.BENCH_H / 2]; }

function unitScreenPos(u) {
  let p = 1;
  if (u.moveCd > 0 && u.moveDur > 0) p = 1 - u.moveCd / u.moveDur;
  const [x0, y0] = cellCenter(u.fr, u.fc), [x1, y1] = cellCenter(u.r, u.c);
  return [x0 + (x1 - x0) * p, y0 + (y1 - y0) * p];
}

/* ---------- 메인 그리기 ---------- */
function draw(now) {
  ctx.clearRect(0, 0, VIEW.W, VIEW.H);
  drawBoardBg();
  if (UI.battleView && UI.battle) drawBattle(UI.battle);
  else drawPrep();
  drawBench();
  drawEffects();
  if (UI.drag && UI.drag.unit) drawDragGhostHint();
}

function drawBoardBg() {
  const C = VIEW.CELL;
  for (let r = 0; r < GROWS; r++) for (let c = 0; c < GCOLS; c++) {
    const mine = r >= 4;
    const dark = (r + c) % 2 === 0;
    ctx.fillStyle = mine ? (dark ? '#3a2e24' : '#33291f') : (dark ? '#2b2420' : '#26201c');
    ctx.fillRect(c * C, r * C, C, C);
  }
  // 중앙선
  ctx.fillStyle = '#f2c14e33';
  ctx.fillRect(0, 4 * C - 1, VIEW.W, 2);
  ctx.strokeStyle = '#00000055'; ctx.lineWidth = 1;
  for (let r = 0; r <= GROWS; r++) { ctx.beginPath(); ctx.moveTo(0, r * C + .5); ctx.lineTo(VIEW.W, r * C + .5); ctx.stroke(); }
  for (let c = 0; c <= GCOLS; c++) { ctx.beginPath(); ctx.moveTo(c * C + .5, 0); ctx.lineTo(c * C + .5, VIEW.BOARD_H); ctx.stroke(); }
}

function drawPrep() {
  const P = human();
  // 상대 진영 안내
  ctx.fillStyle = '#ffffff10';
  ctx.font = '600 15px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#a8987f88';
  const t = roundType(G.stage, G.round);
  ctx.fillText(t === 'pve' ? '👾 중립 몬스터가 기다린다' : '⚔️ 상대 군주 진영', VIEW.W / 2, 2 * VIEW.CELL);
  ctx.font = '12px sans-serif';
  ctx.fillText(`보드 ${P.board.length} / ${boardLimit(P)}`, VIEW.W / 2, 2 * VIEW.CELL + 22);
  // 드래그 중 놓을 수 있는 칸 강조
  if (UI.drag && UI.drag.unit) {
    for (let r = 0; r < CFG.ROWS; r++) for (let c = 0; c < CFG.COLS; c++) {
      const [gr, gc] = toGlobal(0, r, c);
      ctx.fillStyle = '#f2c14e14';
      ctx.fillRect(gc * VIEW.CELL + 2, gr * VIEW.CELL + 2, VIEW.CELL - 4, VIEW.CELL - 4);
    }
  }
  if (UI.hover && UI.hover.kind === 'board' && UI.drag) {
    ctx.strokeStyle = '#f2c14e'; ctx.lineWidth = 2;
    ctx.strokeRect(UI.hover.c * VIEW.CELL + 2, UI.hover.r * VIEW.CELL + 2, VIEW.CELL - 4, VIEW.CELL - 4);
  }
  for (const u of P.board) {
    if (UI.drag && UI.drag.unit === u) continue;
    const [gr, gc] = toGlobal(0, u.r, u.c);
    const [x, y] = cellCenter(gr, gc);
    drawUnitToken(x, y, 25, u, { side: 0 });
  }
}

function drawBench() {
  const P = human();
  ctx.fillStyle = '#1a1512';
  ctx.fillRect(0, VIEW.BENCH_Y, VIEW.W, VIEW.BENCH_H);
  for (let i = 0; i < CFG.BENCH; i++) {
    const x = i * VIEW.BENCH_W;
    ctx.fillStyle = (UI.hover && UI.hover.kind === 'bench' && UI.hover.i === i && UI.drag) ? '#4a3a26' : '#2a221d';
    roundRect(x + 2, VIEW.BENCH_Y + 3, VIEW.BENCH_W - 4, VIEW.BENCH_H - 6, 7); ctx.fill();
    const u = P.bench[i];
    if (u && !(UI.drag && UI.drag.unit === u)) {
      const [cx, cy] = benchCenter(i);
      drawUnitToken(cx, cy - 2, 19, u, { side: 0, small: true });
    }
  }
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

// 유닛 토큰: 코스트 색 테두리 + 이모지 + 별
function drawUnitToken(x, y, rad, u, o = {}) {
  const d = unitDef(u.defId);
  const col = d.cost ? COST_COLOR[d.cost] : '#777';
  ctx.save();
  if (o.alpha != null) ctx.globalAlpha = o.alpha;
  ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2);
  ctx.fillStyle = o.side === 1 ? '#3a1d1d' : '#1d2a3a';
  ctx.fill();
  ctx.lineWidth = o.small ? 2.5 : 3.5; ctx.strokeStyle = col; ctx.stroke();
  if (o.side === 1) { ctx.lineWidth = 1.5; ctx.strokeStyle = '#ff5f5f'; ctx.beginPath(); ctx.arc(x, y, rad + 3, 0, Math.PI * 2); ctx.stroke(); }
  ctx.font = `${Math.round(rad * 1.15)}px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(d.emoji, x, y + 1);
  // 별
  if (u.star > 1) {
    ctx.font = `bold ${o.small ? 9 : 11}px sans-serif`;
    ctx.fillStyle = u.star === 3 ? '#ffd84a' : '#d8e6ff';
    ctx.fillText('★'.repeat(u.star), x, y - rad - (o.small ? 4 : 6));
  }
  // 아이템
  if (u.items && u.items.length) {
    ctx.font = `${o.small ? 9 : 11}px "Segoe UI Emoji",sans-serif`;
    const n = u.items.length, w = o.small ? 10 : 13;
    u.items.forEach((it, i) => ctx.fillText(itemInfo(it).icon, x - (n - 1) * w / 2 + i * w, y + rad + (o.small ? 4 : 7)));
  }
  ctx.restore();
}

/* ---------- 전투 ---------- */
function drawBattle(B) {
  // 화염 지대
  for (const z of B.zones) {
    ctx.fillStyle = `rgba(255,90,30,${0.18 + 0.08 * Math.sin(performance.now() / 120)})`;
    ctx.fillRect(0, z.row * VIEW.CELL, VIEW.W, VIEW.CELL);
    ctx.font = '14px sans-serif';
    for (let c = 0; c < GCOLS; c++) ctx.fillText('🔥', c * VIEW.CELL + 12, z.row * VIEW.CELL + 14);
  }
  drawAimOverlay(B);
  const list = B.units.filter(u => u.alive || u.ghost > 0 || u.reviving > 0);
  list.sort((a, b) => a.r - b.r);
  for (const u of list) {
    const [x, y] = unitScreenPos(u);
    u.sx = x; u.sy = y;
    const alpha = u.ghost > 0 ? 0.45 : u.reviving > 0 ? 0.3 : 1;
    const isAimTarget = UI.aimHover && UI.aimHover.uid === u.uid;
    if (u.undying > 0) glow(x, y, 30, '#ffd84a');
    if (u.taunt > 0) glow(x, y, 30, '#ff8f5a');
    if (isAimTarget) glow(x, y, 32, '#f2c14e');
    drawUnitToken(x, y, 23, u, { side: u.side, alpha });
    if (u.freeze > 0) { ctx.fillStyle = '#8fd8ff66'; ctx.beginPath(); ctx.arc(x, y, 24, 0, Math.PI * 2); ctx.fill(); }
    if (u.ghost <= 0 && u.reviving <= 0) drawBars(u, x, y);
    // 상태 아이콘
    const icons = [];
    if (u.stun > 0) icons.push('💫');
    if (u.burn) icons.push('🔥');
    if (u.slows.length) icons.push('🧊');
    if (u.sunder) icons.push('🎯');
    if (u.taunt > 0) icons.push('🚩');
    if (icons.length) { ctx.font = '11px "Segoe UI Emoji",sans-serif'; ctx.fillText(icons.join(''), x + 18, y - 22); }
  }
}
function glow(x, y, r, color) {
  const g = ctx.createRadialGradient(x, y, r * 0.5, x, y, r);
  g.addColorStop(0, color + 'aa'); g.addColorStop(1, color + '00');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
}
function drawBars(u, x, y) {
  const w = 44, h = 5, bx = x - w / 2, by = y - 33;
  const shield = sum(u.shields.map(s => s.amt));
  const tot = Math.max(u.maxHp, u.hp + shield);
  ctx.fillStyle = '#000a'; ctx.fillRect(bx - 1, by - 1, w + 2, h + 2);
  ctx.fillStyle = u.side === 0 ? '#59d97a' : '#ff5f5f';
  ctx.fillRect(bx, by, w * (u.hp / tot), h);
  if (shield > 0) { ctx.fillStyle = '#e8f0ff'; ctx.fillRect(bx + w * (u.hp / tot), by, w * (shield / tot), h); }
  // 체력 눈금 (300마다)
  ctx.fillStyle = '#0006';
  for (let v = 300; v < tot; v += 300) ctx.fillRect(bx + w * (v / tot), by, 1, h);
  if (u.d.skill) {
    ctx.fillStyle = '#000a'; ctx.fillRect(bx - 1, by + h + 1, w + 2, 4);
    ctx.fillStyle = '#5aa9ff'; ctx.fillRect(bx, by + h + 2, w * clamp(u.mana / u.manaMax, 0, 1), 2);
  }
}

function drawAimOverlay(B) {
  if (!UI.aim) return;
  const S = B.sides[0];
  const sl = S.spells[UI.aim.slot];
  const sp = SPELLS[sl.id];
  const h = UI.aimHover;
  if (sp.target === 'row' && h && h.r != null) {
    ctx.fillStyle = '#ff7a3044'; ctx.fillRect(0, h.r * VIEW.CELL, VIEW.W, VIEW.CELL);
  }
  if ((sp.target === 'cell') && h && h.r != null) {
    ctx.fillStyle = '#7cc6ff33';
    ctx.fillRect((h.c - 1) * VIEW.CELL, (h.r - 1) * VIEW.CELL, VIEW.CELL * 3, VIEW.CELL * 3);
    ctx.strokeStyle = '#7cc6ff'; ctx.lineWidth = 2;
    ctx.strokeRect((h.c - 1) * VIEW.CELL, (h.r - 1) * VIEW.CELL, VIEW.CELL * 3, VIEW.CELL * 3);
  }
  if (sp.target === 'allyCell' && UI.aim.first && h && h.r != null && !B.occ[h.r][h.c]) {
    ctx.strokeStyle = '#b07cff'; ctx.lineWidth = 2;
    ctx.strokeRect(h.c * VIEW.CELL + 3, h.r * VIEW.CELL + 3, VIEW.CELL - 6, VIEW.CELL - 6);
  }
  if (UI.aim.first) {
    const a = unitByUid(B, UI.aim.first);
    if (a) glow(a.sx || 0, a.sy || 0, 34, '#b07cff');
  }
}

/* ---------- 이펙트 ---------- */
function pushEffects(B, events) {
  const pos = uid => { const u = unitByUid(B, uid); return u ? unitScreenPos(u) : null; };
  for (const e of events) {
    switch (e.t) {
      case 'atk': {
        const a = pos(e.uid), b = pos(e.tuid);
        if (!a || !b) break;
        if (e.ranged) FX.projs.push({ x0: a[0], y0: a[1], x1: b[0], y1: b[1], t: 0, dur: 0.18, color: e.ghost ? '#c9a6ff' : '#fff2b0' });
        else FX.flashes.push({ x: b[0], y: b[1], t: 0, dur: 0.15, kind: 'slash' });
        break;
      }
      case 'zap': case 'skillHit': {
        const a = pos(e.uid), b = pos(e.tuid);
        if (a && b) FX.projs.push({ x0: a[0], y0: a[1], x1: b[0], y1: b[1], t: 0, dur: 0.22, color: e.t === 'zap' ? '#8fd0ff' : '#d58cff', big: true });
        break;
      }
      case 'dmg': {
        const p = pos(e.uid); if (!p) break;
        if (e.a < 1) break;
        const big = e.a >= 250 || e.crit;
        FX.floats.push({ x: p[0] + (Math.random() - .5) * 16, y: p[1] - 10, text: Math.round(e.a) + (e.crit ? '!' : ''), color: e.spell ? '#7cc6ff' : e.kind === 'magic' ? '#d58cff' : e.kind === 'true' ? '#ffffff' : (e.crit ? '#ffd84a' : '#ffb27a'), size: big ? 17 : 12, t: 0, dur: 0.8 });
        break;
      }
      case 'heal': { const p = pos(e.uid); if (p) FX.floats.push({ x: p[0], y: p[1] - 14, text: '+' + Math.round(e.a), color: '#59d97a', size: 12, t: 0, dur: 0.8 }); break; }
      case 'shield': { const p = pos(e.uid); if (p) FX.flashes.push({ x: p[0], y: p[1], t: 0, dur: 0.4, kind: 'ring', color: '#e8f0ff' }); break; }
      case 'stun': { const p = pos(e.uid); if (p) FX.flashes.push({ x: p[0], y: p[1], t: 0, dur: 0.3, kind: 'ring', color: '#ffd84a' }); break; }
      case 'skill': {
        const p = pos(e.uid); if (!p) break;
        FX.texts.push({ x: p[0], y: p[1] - 40, text: e.name, color: '#d6b4ff', t: 0, dur: 1.1 });
        FX.flashes.push({ x: p[0], y: p[1], t: 0, dur: 0.35, kind: 'ring', color: '#b07cff' });
        break;
      }
      case 'spell': showSpellBanner(e); {
        const t = e.target || {};
        if (t.uid != null) { const p = pos(t.uid); if (p) FX.flashes.push({ x: p[0], y: p[1], t: 0, dur: 0.6, kind: 'burst', color: e.side === 0 ? '#7cc6ff' : '#ff6b6b' }); }
        if (t.r != null && t.c != null && t.uid == null) { const [x, y] = cellCenter(t.r, t.c); FX.flashes.push({ x, y, t: 0, dur: 0.6, kind: 'burst', color: '#7cc6ff', size: 90 }); }
        if (e.id === 'timestop') FX.shake = 0.3;
        break;
      }
      case 'death': { const p = pos(e.uid); if (p) FX.flashes.push({ x: p[0], y: p[1], t: 0, dur: 0.5, kind: 'burst', color: '#ffffff' }); break; }
      case 'execute': { const p = pos(e.uid); if (p) FX.texts.push({ x: p[0], y: p[1] - 30, text: '처형!', color: '#ff5f5f', t: 0, dur: 1 }); break; }
      case 'leap': case 'blink': { const p = pos(e.uid); if (p) FX.flashes.push({ x: p[0], y: p[1], t: 0, dur: 0.4, kind: 'ring', color: '#ff8f5a' }); break; }
      case 'ghost': { const p = pos(e.uid); if (p) FX.texts.push({ x: p[0], y: p[1] - 30, text: '유령화', color: '#c9a6ff', t: 0, dur: 0.9 }); break; }
      case 'reviveStart': { const p = pos(e.uid); if (p) FX.texts.push({ x: p[0], y: p[1] - 30, text: '부활 중', color: '#fff2b0', t: 0, dur: 1 }); break; }
      case 'laststand': { const p = pos(e.uid); if (p) FX.texts.push({ x: p[0], y: p[1] - 30, text: '최후의 저항!', color: '#ff8f5a', t: 0, dur: 1.2 }); break; }
      case 'overtime': FX.texts.push({ x: VIEW.W / 2, y: VIEW.BOARD_H / 2, text: '⏱ 연장전 — 피해 증가', color: '#ffd84a', t: 0, dur: 1.8 }); break;
      case 'miss': { const p = pos(e.uid); if (p) FX.floats.push({ x: p[0], y: p[1] - 10, text: '회피', color: '#cccccc', size: 11, t: 0, dur: 0.6 }); break; }
    }
  }
}

function drawEffects() {
  const dt = UI.frameDt || 0.016;
  for (const p of FX.projs) {
    p.t += dt;
    const k = Math.min(1, p.t / p.dur);
    const x = p.x0 + (p.x1 - p.x0) * k, y = p.y0 + (p.y1 - p.y0) * k;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(x, y, p.big ? 5 : 3, 0, Math.PI * 2); ctx.fill();
    if (p.big) { ctx.strokeStyle = p.color + '88'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(p.x0 + (p.x1 - p.x0) * Math.max(0, k - .3), p.y0 + (p.y1 - p.y0) * Math.max(0, k - .3)); ctx.lineTo(x, y); ctx.stroke(); }
  }
  FX.projs = FX.projs.filter(p => p.t < p.dur);
  for (const f of FX.flashes) {
    f.t += dt;
    const k = f.t / f.dur;
    ctx.save(); ctx.globalAlpha = Math.max(0, 1 - k);
    if (f.kind === 'slash') {
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(f.x - 12, f.y - 12 + k * 6); ctx.lineTo(f.x + 12, f.y + 12 - k * 6); ctx.stroke();
    } else if (f.kind === 'ring') {
      ctx.strokeStyle = f.color; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(f.x, f.y, 18 + k * 14, 0, Math.PI * 2); ctx.stroke();
    } else if (f.kind === 'burst') {
      const s = (f.size || 40) * (0.4 + k);
      const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, s);
      g.addColorStop(0, f.color + 'cc'); g.addColorStop(1, f.color + '00');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(f.x, f.y, s, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
  FX.flashes = FX.flashes.filter(f => f.t < f.dur);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const f of FX.floats) {
    f.t += dt;
    const k = f.t / f.dur;
    ctx.globalAlpha = Math.max(0, 1 - k * k);
    ctx.font = `800 ${f.size}px sans-serif`;
    ctx.lineWidth = 3; ctx.strokeStyle = '#000';
    ctx.strokeText(f.text, f.x, f.y - k * 22);
    ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y - k * 22);
  }
  FX.floats = FX.floats.filter(f => f.t < f.dur);
  for (const f of FX.texts) {
    f.t += dt;
    const k = f.t / f.dur;
    ctx.globalAlpha = Math.max(0, 1 - k * k);
    ctx.font = '700 12px sans-serif';
    ctx.lineWidth = 3; ctx.strokeStyle = '#000';
    ctx.strokeText(f.text, f.x, f.y - k * 10);
    ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y - k * 10);
  }
  FX.texts = FX.texts.filter(f => f.t < f.dur);
  ctx.globalAlpha = 1;
  if (FX.shake > 0) {
    FX.shake -= dt;
    ctx.fillStyle = `rgba(140,200,255,${FX.shake})`;
    ctx.fillRect(0, 0, VIEW.W, VIEW.BOARD_H);
  }
}

function renderAll() {
  if (!G) return;
  renderTop(); renderTraits(); renderInventory(); renderAugs(); renderSpellBar(); renderShop(); renderPlayers();

function renderTop() {

function renderTraits() {
  const P = human();
  const units = UI.battleView && UI.battle ? null : P.board;
  const counts = computeTraits(units || P.board, P.aug);
  const keys = TRAIT_KEYS.filter(t => counts[t]).sort((a, b) => traitTier(b, counts[b]) - traitTier(a, counts[a]) || counts[b] - counts[a]);
  const box = $('#traits');
  if (!keys.length) { box.innerHTML = '<div class="empty-note">보드에 유닛을 올리면 시너지가 표시됩니다.</div>'; return; }
  box.innerHTML = keys.map(t => {
    const T = TRAITS[t], n = counts[t], tier = traitTier(t, n);
    const next = T.tiers.find(x => x > n);
    return `<div class="trait ${tier ? 'on' : 'off'} t${tier}" style="--tc:${T.color}" data-tip="trait:${t}">
      <div class="ti">${T.icon}</div><div class="tn">${T.name}</div>
      <div class="tc"><b>${n}</b> / ${next || T.tiers[2]}</div></div>`;
  }).join('');
}

function renderInventory() {
  const P = human();
  const box = $('#inventory');
  if (!P.items.length) { box.innerHTML = '<div class="empty-note">아이템 없음</div>'; return; }
  box.innerHTML = P.items.map((it, i) => {
    const info = itemInfo(it);
    return `<div class="item-chip ${info.component ? '' : 'done'}" data-item="${i}" data-tip="item:${it}">${info.icon}</div>`;

}

function renderAugs() {

function renderSpellBar() {
  const P = human();
  const B = UI.battleView ? UI.battle : null;
  const S = B ? B.sides[0] : null;
  const lm = S ? S.lm : (hasAug(P, 'manaHead') ? 3 : 0);
  const lmMax = S ? S.lmMax : (hasAug(P, 'manaVault') ? 14 : CFG.LORD_MANA_MAX);
  $('#lmVal').textContent = Math.floor(lm);
  $('#lmMax').textContent = lmMax;
  const bar = $('#lmBar');
  if (bar.children.length !== lmMax) { bar.innerHTML = '<i><b></b></i>'.repeat(lmMax); bar.style.gridTemplateColumns = `repeat(${lmMax}, 1fr)`; }
  [...bar.children].forEach((el, i) => { el.firstChild.style.transform = `scaleX(${clamp(lm - i, 0, 1)})`; });
  const eq = S ? S.spells : equippedSpells(P);
  const html = eq.map((s, i) => {
    const sp = SPELLS[s.id];
    const cost = S ? spellCostNow(S, s) : spellCost(s.id, s.lvl);
    const ready = S && spellReady(S, i);
    const aiming = UI.aim && UI.aim.slot === i;
    const cdTxt = S && s.cd > 0 ? `<div class="sc-cd">${s.cd.toFixed(1)}</div>` : '';
    const used = S && s.used;
    return `<div class="spell-card ${ready ? 'ready' : ''} ${aiming ? 'aiming' : ''} ${used ? 'used' : ''}" data-spell="${i}" data-tip="spell:${s.id}:${s.lvl}">
      <div class="sc-top"><span class="sc-icon">${sp.icon}</span>${sp.name}<span class="sc-cost">${cost}</span></div>
      <div class="sc-sub"><span>${'◆'.repeat(s.lvl)}${'◇'.repeat(3 - s.lvl)}</span><span>${sp.once ? '1회' : sp.cd + '초'}</span></div>
      ${s.rule !== 'off' ? '<div class="sc-auto">자동 시전</div>' : ''}
      <span class="sc-key">${i + 1}</span>${cdTxt}${used ? '<div class="sc-cd">사용함</div>' : ''}</div>`;
  }).join('');
  const box = $('#spellCards');
  if (box.dataset.html !== html) { box.innerHTML = html || '<div class="empty-note">장착한 주문이 없습니다 (주문서)</div>'; box.dataset.html = html; }
}

function renderShop() {
  const P = human();
  const owned = {};
  for (const u of allUnits(P)) if (u.star === 1) owned[u.defId] = (owned[u.defId] || 0) + 1;
  const ownedAny = {};
  for (const u of allUnits(P)) ownedAny[u.defId] = true;
  $('#shop').innerHTML = P.shop.map((id, i) => {
    if (!id) return `<div class="shop-card sold" style="--cc:#333"></div>`;
    const d = UNITS[id];
    const cls = [ownedAny[id] ? 'owned' : '', owned[id] >= 2 ? 'merge' : '', P.gold < d.cost ? 'poor' : ''].join(' ');
    return `<div class="shop-card ${cls}" style="--cc:${COST_COLOR[d.cost]}" data-shop="${i}" data-own="보유 ${owned[id] || 0}" data-tip="unit:${id}:1">
      <span class="sp">${d.cost}🪙</span><div class="se">${d.emoji}</div><div class="sn">${d.name}</div>
      <div class="st">${d.traits.map(t => TRAITS[t].icon + TRAITS[t].name).join(' ')}</div></div>`;
  }).join('');
}

function renderPlayers() {
  const list = G.players.slice().sort((a, b) => (b.alive - a.alive) || (b.hp - a.hp) || (a.place - b.place));
  const opp = UI.currentOppId;
  $('#players').innerHTML = list.map(P => {
    const hp = Math.max(0, P.hp);
    const st = P.streak > 1 ? `🔥${P.streak}` : P.streak < -1 ? `🧊${-P.streak}` : '';
    return `<div class="prow ${P.isHuman ? 'me' : ''} ${P.alive ? '' : 'dead'} ${opp === P.id ? 'opp' : ''}" data-player="${P.id}">
      <div class="pe">${P.emoji}</div>
      <div class="pm"><div class="pn">${esc(P.name)} <span class="ps">Lv${P.level} ${LORD_TYPES[P.lordType].icon} ${st}</span></div>
      <div class="ph"><i style="width:${Math.min(100, hp)}%"></i></div></div>
      <div class="pv">${P.alive ? hp : '#' + P.place}</div></div>`;
  }).join('');
}

function unitTooltip(defId, star, u, cu) {
  const d = unitDef(defId);
  const m = CFG.STAR_MULT[star] || 1;
  const sk = d.skill;
  let skillTxt = '';
  if (sk) {
    const parts = sk.fx.map(f => {
      const v = f.v ? f.v[star - 1] : null;
      switch (f.t) {
        case 'dmg': return `${f.kind === 'phys' ? '물리' : '마법'} 피해 ${v}`;
        case 'heal': return `회복 ${v}`;
        case 'shield': return `보호막 ${v}`;
        case 'stun': return `기절 ${v}초`;
        case 'slow': return `공속 -${pctS(v)}`;
        case 'burn': return `화상 초당 ${v}`;
        case 'buff': return { as: `공속 +${pctS(v)}`, atk: `공격력 +${pctS(v)}`, armor: `방어 +${v}`, mr: `마저 +${v}` }[f.stat] + (f.tgt === 'allAllies' ? ' (아군 전체)' : '');
        case 'mana': return `아군 마나 +${v}`;
        case 'leap': return '가장 먼 적에게 도약';
        case 'execute': return `체력 ${pctS(v)} 이하 처형`;
        case 'summon': return `${unitDef(f.unit).name} ${f.n}기 소환`;
      }
      return '';
    }).filter(Boolean).join(', ');
    skillTxt = `<hr><b>${sk.name}</b> <span class="tt-sub">(마나 ${d.mana})</span><br>${parts}`;
  }
  const hp = cu ? `${Math.round(cu.hp)}/${Math.round(cu.maxHp)}` : Math.round(d.hp * m);
  const atk = cu ? Math.round(effAtk(cu)) : Math.round(d.atk * m);
  const items = (u || cu) ? (u || cu).items : [];
  return `<h4>${d.emoji} ${d.name} ${'★'.repeat(star)}</h4>
    <div class="tt-sub">${d.cost ? d.cost + '코스트 · ' : ''}${(d.traits || []).map(t => TRAITS[t].icon + ' ' + TRAITS[t].name).join(' · ')}</div>
    <div class="tt-row"><span>❤️ ${hp}</span><span>⚔️ ${atk}</span><span>⚡ ${(cu ? effAS(cu) : d.as).toFixed(2)}</span><span>🎯 사거리 ${cu ? cu.range : d.range}</span>
    <span>🛡️ ${Math.round(cu ? effArmor(cu) : d.armor)}</span><span>🧥 ${Math.round(cu ? effMr(cu) : d.mr)}</span></div>
    ${skillTxt}
    ${items.length ? '<hr>' + items.map(it => { const i = itemInfo(it); return `${i.icon} <b>${i.name}</b> — ${i.desc}${i.component ? '' : ' (' + statText(i.stats) + ')'}`; }).join('<br>') : ''}
    ${u && !UI.battleView ? `<hr><span class="tt-sub">판매가 ${sellPrice(u)}🪙 · 끌어서 이동 · E 키로 판매</span>` : ''}`;
}
function traitTooltip(t) {
  const T = TRAITS[t];
  const P = human();
  const n = computeTraits(P.board, P.aug)[t] || 0;
  const tier = traitTier(t, n);
  const units = Object.values(UNITS).filter(u => u.traits.includes(t)).map(u => u.emoji).join(' ');

    <hr><div class="tt-sub">${units}</div>`;

function spellTooltip(id, lvl) {
  const sp = SPELLS[id];

function showTip(html, x, y) {
  const el = $('#tooltip');
  el.innerHTML = html;
  el.classList.remove('hidden');
  const w = el.offsetWidth, h = el.offsetHeight;
  let tx = x + 16, ty = y + 14;
  if (tx + w > window.innerWidth - 8) tx = x - w - 12;
  if (ty + h > window.innerHeight - 8) ty = window.innerHeight - h - 8;
  el.style.left = Math.max(8, tx) + 'px'; el.style.top = Math.max(8, ty) + 'px';
}
function hideTip() { $('#tooltip').classList.add('hidden'); }

function tipFor(spec) {
  const [kind, a, b] = spec.split(':');
  if (kind === 'trait') return traitTooltip(a);
  if (kind === 'unit') return unitTooltip(a, +b || 1);
  if (kind === 'item') { const i = itemInfo(spec.slice(5)); return `<h4>${i.icon} ${i.name}</h4><div>${i.desc}</div>${i.component ? '<div class="tt-sub">다른 재료와 같은 유닛에 장착하면 완성 아이템이 됩니다.</div>' : `<div class="tt-sub">${statText(i.stats)}</div>`}`; }
  if (kind === 'spell') return spellTooltip(a, +b || 1);
  if (kind === 'aug') { const ag = { id: a, param: b || undefined }; return `<h4>${AUGMENTS[a].icon} ${esc(augName(ag))}</h4><div>${esc(augDesc(ag))}</div>`; }
  return '';
}

 * 10. 모달 — 시작 화면, 증강, 주문 보상, 공용 선택, 주문서, 군주 열람, 결과
 * ===================================================================== */

function openModal(html, bind) {
  $('#modalBox').innerHTML = html;
  $('#modal').classList.remove('hidden');
  hideTip();
  if (bind) bind($('#modalBox'));
}
function closeModal() { $('#modal').classList.add('hidden'); $('#modalBox').innerHTML = ''; }
const modalOpen = () => !$('#modal').classList.contains('hidden');

/* ---------- 시작 화면 ---------- */
function showTitle() {
  const saved = loadGame();
  let lord = 'war', diff = 'normal';
  openModal(`
    <div class="title-hero"><div class="crown">👑</div><h1>일곱 군주의 탁자</h1>
    <p>상점에서 유닛을 사서 배치하면 전투는 자동으로. 군주 마나로 주문을 시전해 전투에 개입하라.<br>성향이 서로 다른 AI 군주 7명 사이에서 마지막까지 살아남으면 승리.</p></div>
    <h3>군주 유형</h3>
    <div class="choice-grid" id="lordPick">${Object.entries(LORD_TYPES).map(([k, L]) => `
      <div class="choice ${k === lord ? 'sel' : ''}" data-lord="${k}"><div class="ci">${L.icon}</div><div class="cn">${L.name}</div>
      <div class="cd">${L.desc}<br>패시브: <b>${L.passive}</b><br>시작 주문: ${L.spells.map(s => SPELLS[s].icon + ' ' + SPELLS[s].name).join(', ')}</div></div>`).join('')}</div>
    <div class="field"><label>난이도</label><div class="seg" id="diffPick">${Object.entries(DIFFICULTY).map(([k, D]) => `<button data-diff="${k}" class="${k === diff ? 'on' : ''}">${D.name}</button>`).join('')}</div></div>
    <div class="field"><label>시드</label><input id="seedIn" placeholder="비우면 무작위" inputmode="numeric" style="width:160px"><small>같은 시드 = 같은 판</small></div>
    <div class="row-btns">
      <button id="tSim" class="ghost">📊 밸런스 시뮬레이션</button>
      <button id="tHelp" class="ghost">도움말</button>
      ${saved && !saved.over ? `<button id="tCont">이어하기 (${saved.stage}-${saved.round})</button>` : ''}
      <button id="tNew" class="primary">새 게임 시작</button>
    </div>`, box => {
    box.querySelectorAll('[data-lord]').forEach(el => el.onclick = () => {
      lord = el.dataset.lord; box.querySelectorAll('[data-lord]').forEach(x => x.classList.toggle('sel', x === el));
    });
    box.querySelectorAll('[data-diff]').forEach(el => el.onclick = () => {
      diff = el.dataset.diff; box.querySelectorAll('[data-diff]').forEach(x => x.classList.toggle('on', x === el));
    });
    box.querySelector('#tNew').onclick = () => {
      const seed = parseInt(box.querySelector('#seedIn').value, 10);
      closeModal();
      startNewGame({ lordType: lord, difficulty: diff, seed: isNaN(seed) ? 0 : seed });
    };
    const c = box.querySelector('#tCont');
    if (c) c.onclick = () => { closeModal(); continueGame(saved); };
    box.querySelector('#tHelp').onclick = () => showHelp(showTitle);
    box.querySelector('#tSim').onclick = () => showSimulation(showTitle);
  });
}

  openModal(`<h2>도움말</h2><p class="sub">배치는 전략, 주문은 전술.</p>
    <div class="help-grid">
      <div><b>준비 단계</b><br>상점에서 유닛을 사고(클릭), 대기석의 유닛을 보드 아래쪽 4줄로 끌어다 놓습니다. 레벨만큼 보드에 올릴 수 있습니다. 같은 유닛 3개 → ★2, ★2 3개 → ★3.</div>
      <div><b>경제</b><br>매 라운드 기본 5골드 + 이자(10골드당 1, 최대 5) + 연승·연패 보너스(2/4/6연속: 1/2/3). 경험치 4골드, 새로고침 2골드.</div>
      <div><b>시너지</b><br>계열(화염·서리·숲·망령·기계·별빛)과 역할(수호자·돌격대·저격수·주술사·암살자·치유사)이 서로 다른 유닛 2/4/6명이면 발동합니다.</div>
      <div><b>아이템</b><br>보관함의 재료를 유닛에 끌어다 놓으면 장착되고, 재료 2개가 모이면 완성 아이템이 됩니다. 유닛당 최대 3개. 판매 시 보관함으로 돌아옵니다.</div>
      <div><b>군주 주문</b><br>전투 중 군주 마나(초당 1.5, 아군 처치 시 +1)가 차면 주문 카드가 밝아집니다. 카드 클릭 또는 <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> → 조준(전투 0.25배속) → 대상 클릭. <kbd>Tab</kbd> 대상 순환, <kbd>Enter</kbd> 시전, <kbd>Esc</kbd>/우클릭 취소.</div>
      <div><b>자동 시전</b><br>주문서에서 주문마다 자동 시전 조건을 고를 수 있습니다. 자동 시전은 직접 시전보다 효과가 10% 약합니다. '즉시 결과' 속도에서는 모든 주문이 자동 규칙으로 시전됩니다.</div>
      <div><b>단축키</b><br><kbd>D</kbd> 새로고침 · <kbd>F</kbd> 경험치 · <kbd>E</kbd> 마우스 아래 유닛 판매 · <kbd>Space</kbd> 준비 완료 · <kbd>B</kbd> 주문서 · <kbd>S</kbd> 전투 속도</div>
      <div><b>라운드</b><br>1단계는 몬스터 3라운드. 2단계부터 대전·공용 선택(체력 낮은 순으로 선택)·몬스터 라운드가 섞입니다. 2·3·4단계 시작 시 증강을 고릅니다. 전투는 30초 제한이며, 15초부터 연장전으로 피해가 점점 커집니다.</div>
    </div>
    <div class="row-btns"><button class="primary" id="hBack">닫기</button></div>`, box => {
    box.querySelector('#hBack').onclick = () => (back ? back() : closeModal());
  });
}

function showMenu() {
  openModal(`<h2>메뉴</h2><p class="sub">시드 ${G.seed} · 난이도 ${DIFFICULTY[G.difficulty].name} · ${roundLabel()}</p>
    <div class="row-btns" style="justify-content:flex-start">
      <button id="mResume" class="primary">계속하기</button>
      <button id="mHelp">도움말</button>
      <button id="mSim">밸런스 시뮬레이션</button>
      <button id="mTitle">시작 화면으로 (자동 저장됨)</button>
    </div>`, box => {
    box.querySelector('#mResume').onclick = closeModal;
    box.querySelector('#mHelp').onclick = () => showHelp(showMenu);
    box.querySelector('#mSim').onclick = () => showSimulation(showMenu);
    box.querySelector('#mTitle').onclick = () => { if (G.phase === 'prep') saveGame(); stopBattle(); showTitle(); };
  });
}

/* ---------- 증강 ---------- */
function showAugmentPick(offers, done) {
  openModal(`<h2>증강 선택</h2><p class="sub">${G.stage}단계 시작 — 세 가지 중 하나를 고르세요.</p>
    <div class="choice-grid">${offers.map((a, i) => `<div class="choice ${AUGMENTS[a.id].spell ? 'spellc' : ''}" data-i="${i}">
      <div class="ci">${AUGMENTS[a.id].icon}</div><div class="cn">${esc(augName(a))}</div><div class="cd">${esc(augDesc(a))}${AUGMENTS[a.id].spell ? '<br><b style="color:#7cc6ff">주문 증강</b>' : ''}</div></div>`).join('')}</div>`, box => {
    box.querySelectorAll('[data-i]').forEach(el => el.onclick = () => { closeModal(); done(offers[+el.dataset.i]); });
  });
}

/* ---------- 주문 보상 ---------- */
function showSpellPick(ids, done) {
  if (!ids.length) return done(null);
  openModal(`<h2>새 주문</h2><p class="sub">보상으로 주문 하나를 얻습니다. 장착은 주문서에서 바꿀 수 있습니다.</p>
    <div class="choice-grid">${ids.map(id => { const sp = SPELLS[id]; return `<div class="choice spellc" data-id="${id}">
      <div class="ci">${sp.icon}</div><div class="cn">${sp.name} <small>마나 ${sp.cost}</small></div>
      <div class="cd">${spellDesc(id, 1)}<br>${sp.once ? '전투당 1회' : '재사용 ' + sp.cd + '초'}</div></div>`; }).join('')}</div>`, box => {
    box.querySelectorAll('[data-id]').forEach(el => el.onclick = () => { closeModal(); done(el.dataset.id); });
  });
}

/* ---------- 주문서 ---------- */
function showSpellbook() {
  const P = human();
  const prep = G.phase === 'prep';
  const render = () => {
    const slots = spellSlots(P);
    openModal(`<h2>📖 주문서</h2><p class="sub">장착 ${P.equipped.length}/${slots}칸 (레벨 7에 3칸) · 강화하면 효과가 오르거나 마나가 줄어듭니다. ${prep ? '' : '<b>전투 중에는 변경할 수 없습니다.</b>'}</p>
      ${P.spells.map((s, i) => {
        const sp = SPELLS[s.id], eq = P.equipped.includes(i);
        const upCost = s.lvl < 3 ? spellUpCost(P, s) : null;
        return `<div class="spellbook-row ${eq ? 'eq' : ''}"><div class="si">${sp.icon}</div>
          <div><b>${sp.name}</b> <small>${'◆'.repeat(s.lvl)}${'◇'.repeat(3 - s.lvl)} · 마나 ${spellCost(s.id, s.lvl)} · ${sp.once ? '전투당 1회' : sp.cd + '초'}</small>
          <div class="sd">${spellDesc(s.id, s.lvl)}${upCost ? ` → <i>${spellDesc(s.id, s.lvl + 1)}</i>` : ''}</div>
          <select data-rule="${i}" ${prep ? '' : 'disabled'}>${['off', ...sp.auto].map(r => `<option value="${r}" ${s.rule === r ? 'selected' : ''}>자동: ${AUTO_RULES[r]}</option>`).join('')}</select></div>
          <div class="sx"><button class="small ${eq ? 'primary' : ''}" data-eq="${i}" ${prep ? '' : 'disabled'}>${eq ? '장착 해제' : '장착'}</button>
          <button class="small" data-up="${i}" ${prep && upCost && P.gold >= upCost ? '' : 'disabled'}>${upCost ? `강화 ${upCost}🪙` : '최대'}</button></div></div>`;
      }).join('')}
      <div class="row-btns"><button class="primary" id="sbClose">닫기</button></div>`, box => {
      box.querySelectorAll('[data-eq]').forEach(el => el.onclick = () => { toggleEquip(P, +el.dataset.eq); render(); renderAll(); });
      box.querySelectorAll('[data-up]').forEach(el => el.onclick = () => { if (upgradeSpell(P, +el.dataset.up)) toast('주문 강화!', 'gold'); render(); renderAll(); });
      box.querySelectorAll('[data-rule]').forEach(el => el.onchange = () => { P.spells[+el.dataset.rule].rule = el.value; renderAll(); });
      box.querySelector('#sbClose').onclick = closeModal;
    });
  };
  render();
}

/* ---------- 군주 열람 ---------- */
function showPlayer(id) {
  const P = G.players.find(p => p.id === id);
  if (!P) return;
  const counts = computeTraits(P.board, P.aug);
  const cells = [];
  for (let r = CFG.ROWS - 1; r >= 0; r--) for (let c = 0; c < CFG.COLS; c++) {
    const u = P.board.find(x => x.r === r && x.c === c);
    cells.push(u ? `<div style="border-color:${COST_COLOR[UNITS[u.defId].cost]}" data-tip="unit:${u.defId}:${u.star}">${UNITS[u.defId].emoji}<small>${'★'.repeat(u.star)}</small></div>` : '<div></div>');
  }
  const traits = TRAIT_KEYS.filter(t => traitTier(t, counts[t] || 0)).map(t => `${TRAITS[t].icon}${TRAITS[t].name} ${counts[t]}`).join(' · ') || '없음';
  const spells = equippedSpells(P).map(s => `${SPELLS[s.id].icon} ${SPELLS[s.id].name} ${'◆'.repeat(s.lvl)}`).join(', ') || '없음';
  const owned = P.spells.map(s => SPELLS[s.id].icon).join(' ');
  openModal(`<h2>${P.emoji} ${esc(P.name)}</h2>
    <p class="sub">${LORD_TYPES[P.lordType].icon} ${LORD_TYPES[P.lordType].name}${P.ai ? ' · ' + esc(P.ai.style) : ''} · 체력 ${Math.max(0, P.hp)} · Lv${P.level} · 🪙${P.gold} · ${P.streak > 0 ? P.streak + '연승' : P.streak < 0 ? -P.streak + '연패' : '연속 기록 없음'}</p>
    <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px">
      <div><h3>보드 <small>(앞줄이 아래)</small></h3><div class="mini-board">${cells.join('')}</div>
        <div style="margin-top:6px;font-size:13px">대기석: ${P.bench.filter(Boolean).map(u => UNITS[u.defId].emoji + (u.star > 1 ? '★' + u.star : '')).join(' ') || '없음'}</div></div>
      <div style="font-size:13px;line-height:1.7"><h3>시너지</h3>${traits}<h3 class="mt">가져갈 주문</h3>${spells}<br><small>보유: ${owned}</small>
        <h3 class="mt">증강</h3>${P.aug.map(a => AUGMENTS[a.id].icon + ' ' + esc(augName(a))).join('<br>') || '없음'}
        <h3 class="mt">최근 전적</h3>${P.history.slice(-8).map(h => h === 'W' ? '🟢' : '🔴').join('') || '-'}</div>
    </div>
    <div class="row-btns"><button class="primary" id="pClose">닫기</button></div>`, box => { box.querySelector('#pClose').onclick = closeModal; });
}

/* ---------- 전투 결과 ---------- */
function showBattleResult(info, done) {
  const B = info.B;
  const mine = B.units.filter(u => u.side === 0 && !u.summon);
  const maxD = Math.max(1, ...mine.map(u => u.dmgDone));
  const S = B.sides[0].stats;
  const head = info.won ? '<div class="result-head win">승리!</div>' : info.timeout ? `<div class="result-head lose">시간 초과 — 양쪽 패배 (-${info.dmg})</div>` : `<div class="result-head lose">패배 (-${info.dmg})</div>`;
  openModal(`${head}<p class="sub">${roundLabel()} · 상대: ${esc(info.oppName)}${info.ghost ? ' (유령 복제)' : ''} · 전투 시간 ${(B.result.ticks * CFG.TICK).toFixed(1)}초</p>
    <h3>유닛별 기여</h3>
    <table class="stats"><tr><th>유닛</th><th>준 피해</th><th style="width:40%"></th><th>받은 피해</th><th>회복</th></tr>
    ${mine.sort((a, b) => b.dmgDone - a.dmgDone).map(u => `<tr><td>${u.d.emoji} ${u.d.name} ${'★'.repeat(u.star)}</td><td>${Math.round(u.dmgDone)}</td>
      <td><div class="bar" style="width:${(u.dmgDone / maxD) * 100}%"></div></td><td>${Math.round(u.dmgTaken)}</td><td>${Math.round(u.healDone)}</td></tr>`).join('')}</table>
    <h3 class="mt">주문 기여</h3>
    <div style="font-size:13px">시전 ${S.casts}회 · 주문 피해 ${Math.round(S.spellDmg)} · 회복 ${Math.round(S.spellHeal)} · 보호막 ${Math.round(S.spellShield)}
    ${B.log.filter(l => l.side === 0).map(l => `<span class="pill">${(l.tick * CFG.TICK).toFixed(1)}s ${SPELLS[B.sides[0].spells[l.slot].id].icon}${l.auto ? '(자동)' : ''}</span>`).join(' ')}</div>
    ${info.rewards ? `<h3 class="mt">보상</h3><div style="font-size:14px">${info.rewards}</div>` : ''}
    <h3 class="mt">다른 탁자</h3><div style="font-size:13px;line-height:1.6">${info.others.join('<br>') || '-'}</div>
    <div class="row-btns"><button class="primary" id="rNext">계속 ▶</button></div>`, box => {
    box.querySelector('#rNext').onclick = () => { closeModal(); done(); };
  });
}

function showGameOver(P) {
  clearSave();
  const win = P.place === 1;
  openModal(`<div class="title-hero"><div class="crown">${win ? '👑' : '🪦'}</div>
    <h1>${win ? '탁자의 주인이 되었습니다!' : `${P.place}위로 탈락`}</h1>
    <p>${roundLabel()}까지 생존 · 레벨 ${P.level} · 시드 ${G.seed}</p></div>
    <h3>최종 순위</h3>
    <div style="font-size:14px;line-height:1.8">${G.players.slice().sort((a, b) => (b.alive - a.alive) || (a.alive ? b.hp - a.hp : a.place - b.place)).map(x => `${x.alive ? (G.players.filter(p => p.alive).length === 1 ? '1위' : `생존 (체력 ${x.hp})`) : x.place + '위'} ${x.emoji} ${esc(x.name)}${x.ai ? ` <small>${esc(x.ai.style)}</small>` : ''}`).join('<br>')}</div>
    <div class="row-btns"><button id="goTitle">시작 화면</button><button class="primary" id="goNew">같은 설정으로 새 게임</button></div>`, box => {
    box.querySelector('#goTitle').onclick = showTitle;
    box.querySelector('#goNew').onclick = () => { const o = { lordType: human().lordType, difficulty: G.difficulty, seed: 0 }; closeModal(); startNewGame(o); };
  });
}

/* ===== 11-flow.js ===== */
/* =====================================================================
 * 11. 진행 — 라운드 흐름, 전투 재생 루프, 공용 선택, 보상, 탈락
 * ===================================================================== */

function startNewGame(opts) {
  stopBattle();
  newGame(opts);
  clearSave();
  beginRound();
}
function continueGame(saved) {
  stopBattle();
  G = saved;
  beginRound();
}
function stopBattle() {
  UI.battle = null; UI.battleView = false; UI.aim = null; UI.pending = null; UI.currentOppId = null;
  FX.floats = []; FX.projs = []; FX.flashes = []; FX.texts = [];
  $('#aimHint').textContent = '';
}

function beginRound() {
  stopBattle();
  if (!G || G.over) return;
  const type = roundType(G.stage, G.round);
  if (type === 'carousel') { G.phase = 'carousel'; renderAll(); return runCarousel(); }
  G.phase = 'prep';
  startPrep();
  const ready = () => { G.phase = 'prep'; renderAll(); toast(`${roundLabel()} 준비 단계 — ${type === 'pve' ? '중립 몬스터' : '대전'}`); };
  if (augmentDue()) {
    for (const P of G.players) if (P.alive && !P.isHuman) applyAugment(P, aiPickAugment(P, augmentOffers(P)));
    G.phase = 'augment';
    renderAll();
    showAugmentPick(augmentOffers(human()), a => {
      applyAugment(human(), a);
      if (!G.pendingSpellPick) return ready();
      G.pendingSpellPick = false;
      showSpellPick(spellOffers(human(), 3), id => { if (id) addSpell(human(), id); ready(); });
    });
  } else ready();
}

function onReady() {
  if (!G || G.phase !== 'prep' || modalOpen()) return;
  const P = human();
  while (P.board.length > boardLimit(P)) {
    const u = P.board.pop();
    const f = benchFree(P);
    if (f >= 0) P.bench[f] = u; else sellUnit(P, u);
  }
  for (const A of G.players) if (A.alive && !A.isHuman) aiPrep(A);
  const type = roundType(G.stage, G.round);
  const seedBase = R().int(2 ** 30);
  const battles = [];
  if (type === 'pve') for (const A of G.players) { if (A.alive) battles.push({ a: A, b: null, pve: true }); }
  else for (const [a, b, ghost] of makePairs()) battles.push({ a, b, ghost: !!ghost });
  for (const bt of battles) if (bt.b && bt.b.isHuman && !bt.ghost) [bt.a, bt.b] = [bt.b, bt.a];
  battles.forEach((bt, i) => { bt.seed = seedBase + i * 7919; });
  const mb = battles.find(bt => bt.a.isHuman);
  for (const bt of battles) if (bt !== mb) bt.B = runBattle(specOf(bt.a), bt.b ? specOf(bt.b) : monsterSpec(), bt.seed);
  G.phase = 'battle';
  UI.pending = { battles, type, mb };
  UI.currentOppId = mb.b ? mb.b.id : null;
  const oppSpec = mb.b ? specOf(mb.b) : monsterSpec();
  if (G.instant) {
    mb.B = runBattle(specOf(P, { forceAuto: true }), oppSpec, mb.seed);
    renderAll();
    finishRound();
    return;
  }
  mb.B = UI.battle = createBattle(specOf(P), oppSpec, mb.seed);
  UI.battleView = true; UI.acc = 0; UI.ending = false;
  pushEffects(UI.battle, UI.battle.ev); UI.battle.ev = [];
  renderAll();
  renderTraitsBattle();
}

// 전투 중에는 시너지 패널에 실제 발동 단계 표시 (스냅샷)
function renderTraitsBattle() { renderTraits(); }

/* ---------- 재생 루프 ---------- */
let lastBarUpdate = 0;
function frame(now) {
  const dt = Math.min(0.05, ((now - UI.lastFrame) / 1000) || 0.016);
  UI.lastFrame = now; UI.frameDt = dt;
  const B = UI.battle;
  if (B && UI.battleView && !B.over && !modalOpen()) {
    UI.acc += dt * G.battleSpeed * (UI.aim ? 0.25 : 1);
    let steps = 0;
    while (UI.acc >= CFG.TICK && steps < 12 && !B.over) {
      UI.acc -= CFG.TICK; steps++;
      stepBattle(B);
      pushEffects(B, B.ev); B.ev = [];
    }
    if (UI.aim && !spellReady(B.sides[0], UI.aim.slot) && !UI.aim.first) cancelAim();
  }
  if (B && B.over && UI.battleView && !UI.ending) {
    UI.ending = true; cancelAim();
    const w = B.result.winner;
    toast(w === 0 ? '승리!' : B.result.timeout ? '시간 초과' : '패배', w === 0 ? 'gold' : 'bad');
    setTimeout(finishRound, 1100);
  }
  if (G) draw(now);
  if (G && UI.battleView && now - lastBarUpdate > 90) { lastBarUpdate = now; renderSpellBar(); }
  requestAnimationFrame(frame);
}

/* ---------- 라운드 종료 ---------- */
function pveRewards(P, won) {
  const r = R(), got = [];
  const comps = G.stage === 1 ? 1 : won ? 2 : 1;
  const gold = won ? (G.stage === 1 ? 1 : 3) : 0;
  for (let i = 0; i < comps; i++) { const it = r.pick(COMP_KEYS); P.items.push(it); got.push(COMPONENTS[it].icon + ' ' + COMPONENTS[it].name); }
  if (gold) { P.gold += gold; got.push(`🪙 ${gold}`); }
  const spellReward = (G.stage === 1 && G.round === 3) || (G.stage >= 2 && won);
  if (spellReward) {
    if (P.isHuman) G.pendingSpellPick = true;
    else { const ids = spellOffers(P, 3); if (ids.length) addSpell(P, aiPickSpell(P, ids)); }
    got.push('📜 새 주문');
  }
  return got.join(' · ');
}

function finishRound() {
  if (!UI.pending) return;
  const { battles, mb } = UI.pending;
  const base = stageBaseDamage(G.stage);
  const others = [];
  let info = null;
  for (const bt of battles) {
    const res = bt.B.result;
    if (bt.pve) {
      const won = res.winner === 0;
      const dmg = won ? 0 : Math.max(1, base + survivorDamage(res.survivors[1]));
      applyResult(bt.a, won, dmg, false, '중립 몬스터');
      const rw = pveRewards(bt.a, won);
      if (bt === mb) info = { won, dmg: bt.a.lastResult.dmg, timeout: res.timeout, oppName: '중립 몬스터', rewards: rw };
    } else {
      const w = res.winner;
      const draw = res.timeout || w === -1;
      const dA = draw ? Math.max(1, base) : base + survivorDamage(res.survivors[1]);
      const dB = draw ? Math.max(1, base) : base + survivorDamage(res.survivors[0]);
      applyResult(bt.a, w === 0, dA, true, bt.b.name);
      if (!bt.ghost) applyResult(bt.b, w === 1, dB, true, bt.a.name);
      if (bt === mb) info = { won: w === 0, dmg: bt.a.lastResult.dmg, timeout: res.timeout, oppName: bt.b.name, ghost: bt.ghost };
      else {
        const tag = draw ? '무승부' : `${(w === 0 ? bt.a : bt.b).emoji} 승`;
        others.push(`${bt.a.emoji} ${esc(bt.a.name)} vs ${bt.b.emoji} ${esc(bt.b.name)}${bt.ghost ? '(유령)' : ''} → ${tag}`);
      }
    }
  }
  if (battles[0].pve) others.push(...battles.filter(bt => bt !== mb).map(bt => `${bt.a.emoji} ${esc(bt.a.name)} → ${bt.B.result.winner === 0 ? '몬스터 처치' : '몬스터에게 패배'}`));
  info.B = mb.B; info.others = others;
  G.phase = 'result';
  renderAll();
  const H = human();
  const proceed = () => {
    const out = processEliminations();
    for (const P of out) toast(`${P.emoji} ${P.name} 탈락 (${P.place}위)`, 'bad');
    const alive = G.players.filter(p => p.alive);
    if (!H.alive || alive.length <= 1) {
      G.over = true; G.phase = 'over';
      stopBattle(); renderAll(); showGameOver(H);
      return;
    }
    advanceRound();
    saveGame();
    beginRound();
  };
  showBattleResult(info, () => {
    if (G.pendingSpellPick) {
      G.pendingSpellPick = false;
      showSpellPick(spellOffers(H, 3), id => { if (id) { addSpell(H, id); toast(`${SPELLS[id].icon} ${SPELLS[id].name} 획득`, 'gold'); } proceed(); });
    } else proceed();
  });
}

/* ---------- 공용 선택 라운드 ---------- */
function runCarousel() {
  const r = R();
  const alive = G.players.filter(P => P.alive);
  const n = alive.length + 1;
  const costs = G.stage <= 2 ? [1, 2] : G.stage === 3 ? [2, 3] : G.stage === 4 ? [3, 4] : [4, 5];
  const nSpells = Math.min(2, Math.floor(n / 3));
  const options = [];
  for (let i = 0; i < n - nSpells; i++) {
    const cost = r.pick(costs);
    const ids = Object.keys(UNITS).filter(k => UNITS[k].cost === cost && G.pool[k] > 0);
    if (!ids.length) continue;
    options.push({ kind: 'unit', defId: r.pick(ids), item: r.pick(COMP_KEYS) });
  }
  for (const id of r.shuffle(SPELL_KEYS.slice()).slice(0, nSpells)) options.push({ kind: 'spell', id });
  r.shuffle(options);
  const order = r.shuffle(alive.slice()).sort((a, b) => a.hp - b.hp);
  let idx = 0;
  const take = (P, i) => {
    const o = options[i];
    o.taken = P;
    if (o.kind === 'unit') {
      takeFromPool(o.defId, 1);
      P.items.push(o.item);
      const f = benchFree(P);
      if (f >= 0) { P.bench[f] = makeUnit(o.defId, 1); checkMerge(P); }
      else { P.gold += UNITS[o.defId].cost; G.pool[o.defId]++; }
    } else if (!addSpell(P, o.id)) P.gold += 2;
  };
  const render = () => {
    const cur = order[idx];
    openModal(`<h2>🎠 공용 선택</h2><p class="sub">체력이 낮은 군주부터 하나씩 고릅니다. ${cur ? (cur.isHuman ? '<b style="color:var(--gold)">당신의 차례입니다!</b>' : `${cur.emoji} ${esc(cur.name)} 고르는 중…`) : ''}</p>
      <div class="queue">${order.map((P, i) => `<span class="${i < idx ? 'done' : i === idx ? 'now' : ''}" title="${esc(P.name)} (${P.hp})">${P.emoji}</span>`).join('')}</div>
      <div class="carousel">${options.map((o, i) => {
        const tk = o.taken ? `<div class="taken-by">${o.taken.emoji} 선택</div>` : '';
        if (o.kind === 'unit') {
          const d = UNITS[o.defId], it = COMPONENTS[o.item];
          return `<div class="choice ${o.taken ? 'disabled' : ''}" data-c="${i}" style="border-color:${COST_COLOR[d.cost]}" data-tip="unit:${o.defId}:1">
            <div class="ci">${d.emoji}</div><div class="cn">${d.name}</div><div class="cd">${d.cost}코스트 · ${it.icon} ${it.name}</div>${tk}</div>`;
        }
        const sp = SPELLS[o.id];
        return `<div class="choice spellc ${o.taken ? 'disabled' : ''}" data-c="${i}" data-tip="spell:${o.id}:1"><div class="ci">${sp.icon}</div><div class="cn">${sp.name}</div><div class="cd">주문 · 마나 ${sp.cost}</div>${tk}</div>`;
      }).join('')}</div>`, box => {
      box.querySelectorAll('[data-c]').forEach(el => el.onclick = () => {
        const i = +el.dataset.c;
        if (!order[idx] || !order[idx].isHuman || options[i].taken) return;
        take(order[idx], i); idx++; render(); renderAll(); setTimeout(step, 350);
      });
    });
  };
  const step = () => {
    if (idx >= order.length) {
      setTimeout(() => { closeModal(); advanceRound(); saveGame(); beginRound(); }, 700);
      return;
    }
    const cur = order[idx];
    render();
    if (cur.isHuman) return;
    setTimeout(() => { take(cur, aiCarouselPick(cur, options)); idx++; render(); step(); }, 420);
  };
  step();
}

/* =====================================================================
 * 12. 입력 — 끌어놓기, 클릭, 주문 조준(감속), 키보드

function canvasPoint(e) {
  const rect = canvas.getBoundingClientRect();
  return [(e.clientX - rect.left) * VIEW.W / rect.width, (e.clientY - rect.top) * VIEW.H / rect.height];
}
function hitTest(x, y) {
  if (x < 0 || x >= VIEW.W || y < 0) return null;
  if (y < VIEW.BOARD_H) return { kind: 'board', r: Math.floor(y / VIEW.CELL), c: Math.floor(x / VIEW.CELL) };
  if (y >= VIEW.BENCH_Y && y < VIEW.H) return { kind: 'bench', i: clamp(Math.floor(x / VIEW.BENCH_W), 0, CFG.BENCH - 1) };
  return null;
}
function overEl(e, el) {
  const r = el.getBoundingClientRect();
  return e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
}
// 준비 화면에서 칸에 있는 플레이어 유닛
function unitAt(h) {
  const P = human();
  if (!h) return null;
  if (h.kind === 'bench') return P.bench[h.i];
  if (h.r < 4) return null;
  return P.board.find(u => u.r === h.r - 4 && u.c === h.c) || null;
}
const boardEditable = () => G && G.phase === 'prep' && !UI.battleView;

/* ---------- 끌어놓기 ---------- */
function beginDrag(e, payload, icon) {
  UI.drag = payload;
  const d = $('#drag');
  d.textContent = icon; d.classList.remove('hidden');
  d.style.left = e.clientX + 'px'; d.style.top = e.clientY + 'px';
  if (payload.unit) $('#sellZone').classList.add('active');
  hideTip();
}
function endDrag() {
  UI.drag = null;
  $('#drag').classList.add('hidden');
  $('#sellZone').classList.remove('active');
}

canvas.addEventListener('pointerdown', e => {
  if (!G || modalOpen()) return;
  const [x, y] = canvasPoint(e);
  const h = hitTest(x, y);
  if (UI.battleView && UI.battle) {
    if (e.button === 2) { cancelAim(); return; }
    if (UI.aim) { aimClick(h); return; }
  }
  if (e.button !== 0) return;
  const u = unitAt(h);
  if (!u) return;
  if (h.kind === 'board' && !boardEditable()) return;
  canvas.setPointerCapture(e.pointerId);
  beginDrag(e, { unit: u, from: h }, UNITS[u.defId].emoji);
});

window.addEventListener('pointermove', e => {
  if (UI.drag) { const d = $('#drag'); d.style.left = e.clientX + 'px'; d.style.top = e.clientY + 'px'; }
  if (!G) return;
  const [x, y] = canvasPoint(e);
  const h = (e.target === canvas || UI.drag) ? hitTest(x, y) : null;
  UI.hover = h;
  if (UI.aim && UI.battle) {
    if (h && h.kind === 'board') {
      const occ = UI.battle.occ[h.r][h.c];
      UI.aimHover = { r: h.r, c: h.c, uid: occ || null };
    }
    return;
  }
  if (UI.drag || e.target !== canvas) return;
  // 캔버스 툴팁
  let html = null;
  if (UI.battleView && UI.battle && h && h.kind === 'board') {
    const bu = UI.battle.units.find(u => (u.alive || u.ghost > 0) && Math.hypot((u.sx || 0) - x, (u.sy || 0) - y) < 26);
    if (bu) html = unitTooltip(bu.defId, bu.star, null, bu);
  }
  if (!html) { const u = unitAt(h); if (u && !(UI.battleView && h.kind === 'board')) html = unitTooltip(u.defId, u.star, u); }
  if (html) showTip(html, e.clientX, e.clientY); else hideTip();
});
canvas.addEventListener('pointerleave', () => { if (!UI.drag) { hideTip(); UI.hover = null; } });
canvas.addEventListener('contextmenu', e => { e.preventDefault(); cancelAim(); });

window.addEventListener('pointerup', e => {
  if (!UI.drag || !G) return;
  const drag = UI.drag;
  endDrag();
  const P = human();
  if (drag.unit) {
    if (overEl(e, $('#sellZone')) || overEl(e, $('#shop'))) {
      if (P.board.includes(drag.unit) && !boardEditable()) return;
      sellUnit(P, drag.unit); toast(`판매 +${sellPrice(drag.unit)}🪙`); renderAll(); return;
    }
    const [x, y] = canvasPoint(e);
    const h = hitTest(x, y);
    if (h) moveUnit(P, drag.unit, drag.from, h);
    renderAll();
    return;
  }
  if (drag.item != null) {
    const [x, y] = canvasPoint(e);
    const h = hitTest(x, y);
    const u = unitAt(h);
    if (!u) return;
    if (h.kind === 'board' && !boardEditable()) { toast('전투 중에는 보드 유닛에 장착할 수 없습니다', 'bad'); return; }
    const it = P.items[drag.item];
    if (equipItem(u, it)) { P.items.splice(drag.item, 1); toast(`${itemInfo(u.items[u.items.length - 1]).icon} 장착`); }
    else toast('아이템 칸이 가득 찼습니다 (최대 3개)', 'bad');
    renderAll();
  }
});

function moveUnit(P, u, from, to) {
  const onBoard = P.board.includes(u);
  if (to.kind === 'board') {
    if (!boardEditable()) return;
    if (to.r < 4) { toast('아래쪽 4줄에만 배치할 수 있습니다', 'bad'); return; }
    const lr = to.r - 4, lc = to.c;
    const other = P.board.find(x => x.r === lr && x.c === lc);
    if (other === u) return;
    if (onBoard) {
      if (other) { other.r = u.r; other.c = u.c; }
      u.r = lr; u.c = lc;
    } else {
      const bi = P.bench.indexOf(u);
      if (other) { // 대기석 유닛과 보드 유닛 교체
        P.board.splice(P.board.indexOf(other), 1); P.bench[bi] = other;
        delete other.r; delete other.c;
      } else if (P.board.length >= boardLimit(P)) { toast(`보드는 최대 ${boardLimit(P)}명 (레벨을 올리세요)`, 'bad'); return; }
      else P.bench[bi] = null;
      u.r = lr; u.c = lc; P.board.push(u);
    }
  } else if (to.kind === 'bench') {
    const other = P.bench[to.i];
    if (onBoard) {
      if (!boardEditable()) return;
      if (other) { // 교체
        other.r = u.r; other.c = u.c; P.board.push(other);
      }
      P.board.splice(P.board.indexOf(u), 1);
      delete u.r; delete u.c;
      P.bench[to.i] = u;
    } else {
      const bi = P.bench.indexOf(u);
      P.bench[bi] = other; P.bench[to.i] = u;
    }
  }
}

/* ---------- 주문 조준 ---------- */
function startAim(i) {
  const B = UI.battle;
  if (!B || B.over) return;
  const S = B.sides[0];
  const sl = S.spells[i];
  if (!sl) return;
  if (!spellReady(S, i)) {
    toast(sl.used ? '이미 사용한 주문입니다' : sl.cd > 0 ? `재사용 대기 ${sl.cd.toFixed(1)}초` : `군주 마나 부족 (${spellCostNow(S, sl)} 필요)`, 'bad');
    return;
  }
  const sp = SPELLS[sl.id];
  if (sp.target === 'none') { queueSpell(B, 0, i, {}); cancelAim(); return; }
  UI.aim = { slot: i, first: null };
  UI.aimHover = null; UI.tabIdx = -1;
  updateAimHint();
  renderSpellBar();
}
function cancelAim() {
  UI.aim = null; UI.aimHover = null;
  $('#aimHint').textContent = '';
}
function updateAimHint() {
  if (!UI.aim) { $('#aimHint').textContent = ''; return; }
  const sp = SPELLS[UI.battle.sides[0].spells[UI.aim.slot].id];
  const t = {
    ally: '아군 유닛을 선택', enemy: '적 유닛을 선택', row: '가로 줄을 선택', cell: '범위 중심 칸을 선택',
    ally2: UI.aim.first ? '맞바꿀 두 번째 아군 선택' : '첫 번째 아군 선택', allyCell: UI.aim.first ? '이동할 빈 칸 선택' : '이동시킬 아군 선택',
  }[sp.target];
  $('#aimHint').textContent = `${sp.icon} ${sp.name} — ${t} (0.25배속 · Tab 순환 · Enter 시전 · Esc 취소)`;
}
function aimClick(h) {
  if (!h || h.kind !== 'board') return;
  const B = UI.battle;
  const occ = B.occ[h.r][h.c];
  UI.aimHover = { r: h.r, c: h.c, uid: occ || null };
  confirmAim();
}
function confirmAim() {
  const B = UI.battle, a = UI.aim, hv = UI.aimHover;
  if (!B || !a || !hv) return;
  const S = B.sides[0];
  const sp = SPELLS[S.spells[a.slot].id];
  const u = hv.uid ? unitByUid(B, hv.uid) : null;
  const ally = u && u.side === 0 && targetable(u), foe = u && u.side === 1 && targetable(u);
  let target = null;
  switch (sp.target) {
    case 'ally': if (ally) target = { uid: u.uid }; break;
    case 'enemy': if (foe) target = { uid: u.uid }; break;
    case 'row': target = { r: hv.r }; break;
    case 'cell': target = { r: hv.r, c: hv.c }; break;
    case 'ally2':
      if (!ally) break;
      if (!a.first) { a.first = u.uid; updateAimHint(); return; }
      if (u.uid !== a.first) target = { uid: a.first, uid2: u.uid };
      break;
    case 'allyCell':
      if (!a.first) { if (ally) { a.first = u.uid; updateAimHint(); } return; }
      if (!B.occ[hv.r][hv.c]) target = { uid: a.first, r: hv.r, c: hv.c };
      break;
  }
  if (!target) { toast('올바른 대상이 아닙니다', 'bad'); return; }
  queueSpell(B, 0, a.slot, target);
  cancelAim();
}
// Tab: 유효한 대상을 순환
function aimCandidates() {
  const B = UI.battle, a = UI.aim;
  const sp = SPELLS[B.sides[0].spells[a.slot].id];
  const allies = B.units.filter(u => u.side === 0 && targetable(u)), foes = B.units.filter(u => u.side === 1 && targetable(u));
  const asHover = u => ({ r: u.r, c: u.c, uid: u.uid });
  switch (sp.target) {
    case 'ally': return allies.map(asHover);
    case 'enemy': case 'cell': return foes.map(asHover);
    case 'row': return [...new Set(foes.map(u => u.r))].map(r => ({ r, c: 3, uid: null }));
    case 'ally2': return allies.filter(u => u.uid !== a.first).map(asHover);
    case 'allyCell': {
      if (!a.first) return allies.map(asHover);
      const c = [];
      for (let r = 4; r < GROWS; r++) for (let cc = 0; cc < GCOLS; cc++) if (!B.occ[r][cc]) c.push({ r, c: cc, uid: null });
      return c;
    }
  }
  return [];
}

/* ---------- 키보드 ---------- */
window.addEventListener('keydown', e => {
  if (!G) return;
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) return;
  const k = e.key.toLowerCase();
  if (modalOpen()) {
    if (k === 'escape') { const b = $('#pClose, #sbClose, #hBack, #mResume'); if (b) b.click(); }
    return;
  }
  if (UI.aim) {
    if (k === 'escape') { cancelAim(); e.preventDefault(); return; }
    if (k === 'tab') {
      e.preventDefault();
      const list = aimCandidates();
      if (!list.length) return;
      UI.tabIdx = (UI.tabIdx + (e.shiftKey ? -1 : 1) + list.length) % list.length;
      UI.aimHover = list[UI.tabIdx];
      return;
    }
    if (k === 'enter') { e.preventDefault(); confirmAim(); return; }
  }
  if (['1', '2', '3', '4'].includes(k) && UI.battleView) { startAim(+k - 1); return; }
  if (k === 'd') $('#btnRoll').click();
  else if (k === 'f') $('#btnXp').click();
  else if (k === ' ') { e.preventDefault(); onReady(); }
  else if (k === 'b') showSpellbook();
  else if (k === 's') cycleSpeed();
  else if (k === 'h') showHelp();
  else if (k === 'e') {
    const u = unitAt(UI.hover);
    if (u && (!human().board.includes(u) || boardEditable())) { sellUnit(human(), u); toast(`판매 +${sellPrice(u)}🪙`); hideTip(); renderAll(); }
  }
});

/* ===== 13-sim.js ===== */
/* =====================================================================
 * 13. 밸런스 시뮬레이션 — 무작위 보드끼리 화면 없이 수백 판을 돌려
 *     시너지별·주문별 승률과 '주문 유무에 따른 승률 차이'를 측정한다.
 * ===================================================================== */

function simRandomBoard(rng, level) {
  const focus = [rng.pick(TRAIT_KEYS), rng.pick(TRAIT_KEYS)];
  const ids = Object.keys(UNITS);
  const chosen = [];
  let guard = 0;
  while (chosen.length < level && guard++ < 500) {
    const cost = rng.weighted(SHOP_ODDS[level]) + 1;
    let cand = ids.filter(id => UNITS[id].cost === cost && !chosen.some(u => u.defId === id));
    if (rng.chance(0.65)) {
      const f = cand.filter(id => UNITS[id].traits.some(t => focus.includes(t)));
      if (f.length) cand = f;
    }
    if (!cand.length) continue;
    chosen.push({ uid: 0, defId: rng.pick(cand), star: rng.chance(0.4) ? 2 : 1, items: [] });
  }
  // 핵심 유닛에게 무작위 완성 아이템 2개
  const carry = chosen.slice().sort((a, b) => UNITS[b.defId].cost - UNITS[a.defId].cost)[0];
  for (let i = 0; i < 2; i++) carry.items.push(itemKey(rng.pick(COMP_KEYS), rng.pick(COMP_KEYS)));
  const P = { board: [], aug: [], ai: { focus } };
  placeFormation(P, chosen);
  return P;
}
function simSpec(P, spells, lordType) {
  return {
    name: '시뮬', emoji: '🤖', units: P.board.map(u => ({ defId: u.defId, star: u.star, items: u.items, r: u.r, c: u.c })),
    traits: computeTraits(P.board, []), aug: [], lordType, spells,
    ai: spells.length ? { tend: 0.5, castDelay: 0, mult: CFG.AUTO_CAST_MULT } : null,
  };
}
function simSpells(rng) {
  const ids = rng.shuffle(SPELL_KEYS.slice());
  const out = [];
  for (const id of ids) {
    if (out.length >= 2) break;
    if (SPELLS[id].once && out.some(s => SPELLS[s.id].once)) continue;
    out.push({ id, lvl: 1 + rng.int(2) });
  }
  return out;
}

function runSimulation(n, onProgress, onDone) {
  const rng = new RNG(20261003);
  const traits = {}, spells = {};
  let noSpell = 0, withSpell = 0, i = 0, timeouts = 0;
  const rec = (map, k, win) => { const s = map[k] || (map[k] = { g: 0, w: 0 }); s.g++; if (win) s.w++; };
  const chunk = () => {
    const end = Math.min(n, i + 8);
    for (; i < end; i++) {
      const A = simRandomBoard(rng, 7), Bd = simRandomBoard(rng, 7);
      const sA = simSpells(rng), sB = simSpells(rng);
      const lA = rng.pick(['war', 'guard', 'tactic']), lB = rng.pick(['war', 'guard', 'tactic']);
      const seed = rng.int(2 ** 30);
      const r0 = runBattle(simSpec(A, [], lA), simSpec(Bd, [], lB), seed).result;
      const r1 = runBattle(simSpec(A, sA, lA), simSpec(Bd, [], lB), seed).result;
      const r2 = runBattle(simSpec(A, sA, lA), simSpec(Bd, sB, lB), seed).result;
      if (r0.winner === 0) noSpell++;
      if (r1.winner === 0) withSpell++;
      if (r2.timeout) timeouts++;
      for (const [P, side] of [[A, 0], [Bd, 1]]) {
        const c = computeTraits(P.board, []);
        for (const t of TRAIT_KEYS) if (traitTier(t, c[t] || 0)) rec(traits, t, r2.winner === side);
      }
      for (const s of sA) rec(spells, s.id, r2.winner === 0);
      for (const s of sB) rec(spells, s.id, r2.winner === 1);
    }
    onProgress(i / n);
    if (i < n) setTimeout(chunk, 0);
    else onDone({ n, traits, spells, noSpell: noSpell / n, withSpell: withSpell / n, timeouts: timeouts / n });
  };
  chunk();
}

function showSimulation(back) {
  openModal(`<h2>📊 밸런스 시뮬레이션</h2>
    <p class="sub">레벨 7 무작위 보드끼리 화면 없이 전투를 돌립니다. 같은 보드·같은 시드에서 '주문 없음' 대 '한쪽만 주문 사용'을 비교해 주문의 영향력(목표 15~25%p)을 측정합니다.</p>
    <div class="field"><label>전투 수</label><select id="simN"><option>60</option><option selected>150</option><option>300</option></select>
    <button class="primary" id="simGo">실행</button><span id="simProg" class="pill">대기</span></div>
    <div id="simOut"></div>
    <div class="row-btns"><button id="simBack">닫기</button></div>`, box => {
    box.querySelector('#simBack').onclick = () => (back ? back() : closeModal());
    box.querySelector('#simGo').onclick = () => {
      const n = +box.querySelector('#simN').value;
      box.querySelector('#simGo').disabled = true;
      runSimulation(n, p => { box.querySelector('#simProg').textContent = Math.round(p * 100) + '%'; }, res => {
        box.querySelector('#simGo').disabled = false;
        const row = (name, s) => `<tr><td>${name}</td><td>${s.g}</td><td>${Math.round(s.w / s.g * 100)}%</td><td style="width:40%"><div class="bar" style="width:${s.w / s.g * 100}%"></div></td></tr>`;
        const diff = Math.round((res.withSpell - res.noSpell) * 100);
        box.querySelector('#simOut').innerHTML = `
          <h3>주문 영향력</h3><div style="font-size:14px">A 진영 승률: 주문 없음 <b>${Math.round(res.noSpell * 100)}%</b> → 주문 사용 <b>${Math.round(res.withSpell * 100)}%</b>
          (차이 <b style="color:${diff >= 15 && diff <= 25 ? 'var(--green)' : 'var(--gold)'}">${diff >= 0 ? '+' : ''}${diff}%p</b>, 목표 +15~25%p) · 시간 초과 ${Math.round(res.timeouts * 100)}%</div>
          <h3 class="mt">시너지별 승률 (발동 시)</h3><table class="stats"><tr><th>시너지</th><th>판</th><th>승률</th><th></th></tr>
          ${Object.entries(res.traits).sort((a, b) => b[1].w / b[1].g - a[1].w / a[1].g).map(([t, s]) => row(TRAITS[t].icon + ' ' + TRAITS[t].name, s)).join('')}</table>
          <h3 class="mt">주문별 승률 (양쪽 주문 사용)</h3><table class="stats"><tr><th>주문</th><th>판</th><th>승률</th><th></th></tr>
          ${Object.entries(res.spells).sort((a, b) => b[1].w / b[1].g - a[1].w / a[1].g).map(([id, s]) => row(SPELLS[id].icon + ' ' + SPELLS[id].name, s)).join('')}</table>`;
      });
    };
  });
}
