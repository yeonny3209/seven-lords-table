<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>일곱 군주의 탁자</title>
<meta name="description" content="AI 군주 7명과 겨루는 브라우저 오토배틀러. 배치는 전략, 주문은 전술.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👑</text></svg>">
<style>
/*__CSS__*/
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">👑 <span>일곱 군주의 탁자</span></div>
    <div class="round-info"><span id="roundLabel">1-1</span><span id="roundType" class="pill">몬스터</span></div>
    <div class="stats">
      <div class="stat" title="군주 체력"><span>❤️</span><b id="hpVal">100</b></div>
      <div class="stat" title="골드 (이자: 10골드당 1)"><span>🪙</span><b id="goldVal">0</b><small id="interestVal"></small></div>
      <div class="stat lvl" title="레벨 = 보드 유닛 수"><span>Lv</span><b id="lvlVal">1</b>
        <div class="xpbar"><i id="xpFill"></i></div><small id="xpVal">0/2</small></div>
      <div class="stat" title="연승(+)/연패(-)"><span id="streakIcon">➖</span><b id="streakVal">0</b></div>
    </div>
    <div class="top-actions">
      <button id="btnSpeed" class="ghost" title="전투 속도 (S)">1배속</button>
      <button id="btnHelp" class="ghost" title="도움말 (H)">?</button>
      <button id="btnMenu" class="ghost" title="메뉴">☰</button>
    </div>
  </header>

  <main id="layout">
    <aside id="left">
      <h3>시너지</h3>
      <div id="traits"></div>
      <h3 class="mt">보관함 <small>(유닛에 끌어다 장착)</small></h3>
      <div id="inventory"></div>
      <h3 class="mt">증강</h3>
      <div id="augList"></div>
    </aside>

    <section id="center">
      <div id="boardWrap">
        <canvas id="board"></canvas>
        <div id="banner"></div>
        <div id="aimHint"></div>
      </div>
      <div id="spellBar">
        <div class="lordmana">
          <div class="lm-label">군주 마나 <b id="lmVal">0</b>/10</div>
          <div class="lm-bar" id="lmBar"></div>
        </div>
        <div id="spellCards"></div>
        <button id="btnSpellbook" class="ghost small" title="주문서 (B)">📖 주문서</button>
        <button id="btnReady" class="primary" title="준비 완료 (Space)">준비 완료 ▶</button>
      </div>
      <div id="shopBar">
        <div class="shop-actions">
          <button id="btnXp" title="경험치 구매 (F)">⬆ 경험치<br><small>4🪙</small></button>
          <button id="btnRoll" title="새로고침 (D)">🔄 새로고침<br><small>2🪙</small></button>
        </div>
        <div id="shop"></div>
        <div id="sellZone">판매하려면<br>여기로 끌어오기</div>
      </div>
    </section>

    <aside id="right">
      <h3>군주 순위 <small>(클릭해 열람)</small></h3>
      <div id="players"></div>
      <div id="matchInfo"></div>
    </aside>
  </main>

  <div id="tooltip" class="hidden"></div>
  <div id="drag" class="hidden"></div>
  <div id="modal" class="hidden"><div class="modal-box" id="modalBox"></div></div>
  <div id="toasts"></div>
</div>
<script>
/*__JS__*/
</script>
</body>
</html>
